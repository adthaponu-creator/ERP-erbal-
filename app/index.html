
  <!DOCTYPE html>

      <meta charset="UTF-8" />

      <title>METAHERB</title>
      <script>
        // Decode SPA redirect — accepts:
        //   /ERP-erbal-/app/?/testlab         (from 404.html on Pages)
        //   /…/index.html?/testlab             (direct from gallery)
        (function(l) {
          if (l.search[1] === '/') {
            var route = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            var base = l.pathname.replace(/\/index\.html$/, '/').replace(/\/$/, '');
            window.history.replaceState(null, null, base + route + l.hash);
          }
        }(window.location));
      </script>
