    color: #0f172a;
  }
  .tap { min-height: 44px; }
  .field-wrap { position: relative; }
  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    padding-left: 2px;
  }
  .field-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #cbd5e1;
    border-radius: 12px;
    background: white;
    font-size: 14px;
    line-height: 1.4;

  }
  .field-input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
  .field-input:disabled { background: #f8fafc; color: #94a3b8; }

  .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  @media print {
    .no-print { display: none !important; }
    body { background: white; }
    .print-area { box-shadow: none !important; border: none !important; }
  }

/* ============================ HELPERS ============================ */
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`;
};
const fmtTime = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
};
const newSampleCode = () => {
  const seq = Math.floor(Math.random() * 9000) + 1000;
  const yy = new Date().getFullYear() + 543;
  return `QC-${yy}-${seq}`;
};
const newReqCode = () => {
  const seq = Math.floor(Math.random() * 9000) + 1000;

};

/* ============================ SEARCHABLE DROPDOWN ============================ */
const SearchableDropdown = ({ value, onChange, options, placeholder, renderOption, getKey, getLabel, disabled }) => {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const ref = useRef(null);

  useEffect(() => {
    const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, []);

  const filtered = useMemo(() => {
    if (!q.trim()) return options;
    const s = q.toLowerCase();
    return options.filter(o => getLabel(o).toLowerCase().includes(s));
  }, [q, options]);

  const selected = options.find(o => getKey(o) === value);

  return (
    <div className="relative" ref={ref}>
      <button
        type="button"
        disabled={disabled}
        onClick={() => !disabled && setOpen(v => !v)}
        className={`field-input text-left flex items-center justify-between ${disabled ? '' : 'cursor-pointer'}`}
      >
        <span className={selected ? 'text-slate-900' : 'text-slate-400'}>
          {selected ? getLabel(selected) : placeholder}
        </span>
        <Icon name="chevDown" className={`w-4 h-4 text-slate-400 transition-transform ${open ? 'rotate-180' : ''}`} />
      </button>
      {open && (
        <div className="absolute z-30 top-full left-0 right-0 mt-1.5 bg-white border-2 border-emerald-200 rounded-xl shadow-xl max-h-72 overflow-hidden flex flex-col">
          <div className="p-2 border-b border-slate-100">
            <div className="relative">
              <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
              <input
                autoFocus
                value={q}
                onChange={e => setQ(e.target.value)}
                placeholder="ค้นหา..."
                className="w-full pl-8 pr-2 py-1.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:border-emerald-400"
              />
            </div>
          </div>
          <div className="overflow-y-auto scrollbar flex-1">
            {filtered.length === 0 ? (
              <div className="text-center text-sm text-slate-400 py-6">ไม่พบรายการ</div>
            ) : filtered.map(o => (
              <button
                key={getKey(o)}
                type="button"
                onClick={() => { onChange(getKey(o)); setOpen(false); setQ(''); }}
                className={`w-full text-left px-3 py-2 text-sm hover:bg-emerald-50 border-b border-slate-50 last:border-0 ${
                  getKey(o) === value ? 'bg-emerald-50' : ''
                }`}
              >
                {renderOption ? renderOption(o) : getLabel(o)}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

/* ============================ FORM PAGE ============================ */
const NewSampleForm = ({ onCancel, onSaved, onPrint, prefill }) => {
  const [liveLots, setLiveLots] = useState(() => getLiveLots());

  const [sourceType, setSourceType] = useState(() => {
    if (prefill?.triggerType === 'gr') return 'raw_material';
    if (prefill?.triggerType === 'wo') return 'work_order';
    if (prefill?.triggerType === 'stability') return 'stability';
    if (prefill?.triggerType === 'complaint') return 'returned';
    return 'work_order';
  });
  const [sourceRef,  setSourceRef]  = useState(prefill?.sourceRef || '');
  const [productCode, setProductCode] = useState(prefill?.productCode || '');
  const [lotNumber, setLotNumber] = useState(prefill?.lotNumber || '');

  // Item 3: Retain Sample storage
  const [retainStorage,  setRetainStorage]  = useState('WH-RETAIN-01');
  const [retainExpiry,   setRetainExpiry]   = useState('');
  const [retainShelf,    setRetainShelf]    = useState('');
  const [mfgDate, setMfgDate] = useState('');
  const [expDate, setExpDate] = useState('');
  const [retestDate, setRetestDate] = useState('');
  const [storageCond, setStorageCond] = useState('');
  const [receiveDate, setReceiveDate] = useState(todayISO());
  const [note, setNote] = useState('');
  // Sampling requisition fields
  const [requestedBy, setRequestedBy] = useState('QC Operator');
  const [purpose, setPurpose] = useState('routine');
  // testConfig: { [code]: { selected: bool, mode: 'usp'|'sqrt'|'fixed', fixedQty: number } }
  const [testConfig, setTestConfig] = useState({});
  const [bufferPct, setBufferPct] = useState(20);
  const [showSuccess, setShowSuccess] = useState(null); // saved sample (+ req data)

  const resetForm = () => {
    setSourceType('work_order');
    setSourceRef('');
    setProductCode('');
    setLotNumber('');
    setMfgDate('');
    setExpDate('');
    setRetestDate('');
    setStorageCond('');
    setReceiveDate(todayISO());
    setNote('');
    setRequestedBy('QC Operator');
    setPurpose('routine');
    setTestConfig({});
    setBufferPct(20);
    setShowSuccess(null);
    setLiveLots(getLiveLots());
  };

  const selectedProduct = useMemo(
    () => PRODUCTS.find(p => p.code === productCode),
    [productCode]
  );

  // Mapping: ประเภทแหล่งที่มา → หมวดสินค้าที่ allowed
  // raw_material = วัตถุดิบ + packaging · ที่เหลือ = finished good
  const allowedCategories = useMemo(() => {
    const map = {
      raw_material: ['RM', 'PK'],
      work_order:   ['FG'],
      in_process:   ['FG'],
      finished:     ['FG'],
      stability:    ['FG'],
      returned:     ['FG'],
    };
    return map[sourceType] || null;   // null = ไม่ filter
  }, [sourceType]);

  // Products ที่ผ่าน 2 filter: (1) มี lot กักกัน  (2) category ตรงกับ sourceType
  const availableProducts = useMemo(() => {
    return PRODUCTS.filter(p => {
      const hasLot = liveLots.some(l => l.productCode === p.code);
      if (!hasLot) return false;
      if (!allowedCategories) return true;
      return allowedCategories.includes(p.category);
    });
  }, [allowedCategories, liveLots]);

  // เมื่อเปลี่ยน sourceType ถ้า productCode ปัจจุบันไม่อยู่ใน allowed → เคลียร์
  useEffect(() => {
    if (!productCode) return;
    const inList = availableProducts.some(p => p.code === productCode);
    if (!inList) setProductCode('');
  }, [sourceType, availableProducts]);

  // Lots ของสินค้าที่เลือก (สถานะกักกัน รอ QC) — ใช้ live quantity
  const productLots = useMemo(
    () => liveLots.filter(l => l.productCode === productCode),
    [productCode, liveLots]
  );

  const selectedLot = useMemo(
    () => productLots.find(l => l.lotNumber === lotNumber),
    [productLots, lotNumber]
  );

  const panel = useMemo(() => {
    if (!selectedProduct) return [];
    return TEST_PANELS[selectedProduct.category] || [];
  }, [selectedProduct]);

  // เมื่อเปลี่ยนสินค้า: เคลียร์ค่าที่ผูกกับ lot + init test config
  useEffect(() => {
    setLotNumber('');
    setMfgDate('');
    setExpDate('');
    setRetestDate('');
    setStorageCond('');
    const next = {};
    panel.forEach(t => {
      next[t.code] = { selected: true, mode: 'usp', fixedQty: t.sampleSize };
    });
    setTestConfig(next);
  }, [productCode]);

  // คำนวณ sample size ตามโหมด
  const computeSampleSize = (test, cfg, lotQty) => {
    if (!cfg) return 0;
    if (cfg.mode === 'usp')   return test.sampleSize;
    if (cfg.mode === 'sqrt')  return lotQty > 0 ? Math.ceil(Math.sqrt(lotQty) + 1) : 0;
    if (cfg.mode === 'fixed') return Math.max(0, Number(cfg.fixedQty) || 0);
    return test.sampleSize;
  };

  // เมื่อเลือก lot → auto-fill ทุกฟิลด์ที่ผูกกับ lot
  const applyLot = (lotNum) => {
    setLotNumber(lotNum);
    const lot = liveLots.find(l => l.productCode === productCode && l.lotNumber === lotNum);
    if (!lot) return;
    setMfgDate(lot.mfgDate || '');
    setExpDate(lot.expDate || '');
    setRetestDate(lot.retestDate || '');
    setStorageCond(lot.storageCond || '');
    if (!sourceRef.trim() && lot.sourceRef) setSourceRef(lot.sourceRef);
    // Auto-derive sourceType จาก prefix ของ ref + category
    if (lot.sourceRef?.startsWith('WO-')) {
      setSourceType('work_order');
    } else if (lot.sourceRef?.startsWith('PO-')) {
      setSourceType(selectedProduct?.category === 'PK' ? 'raw_material' : 'raw_material');
    }
  };

  // คำนวณจำนวนสุ่ม — เก็บผลลัพธ์ต่อ test (ใช้ทั้งใน summary และ print)
  const lotQty = selectedLot?.quantity || 0;
  const computedTests = useMemo(() => {
    return panel
      .filter(t => testConfig[t.code]?.selected)
      .map(t => {
        const cfg = testConfig[t.code];
        return {
          ...t,
          mode: cfg.mode,
          fixedQty: cfg.fixedQty,
          computedQty: computeSampleSize(t, cfg, lotQty),
        };
      });
  }, [panel, testConfig, lotQty]);

  const testSampleSum = computedTests.reduce((s, t) => s + t.computedQty, 0);
  const bufferQty = Math.ceil(testSampleSum * bufferPct / 100);
  const totalSampleQty = testSampleSum + bufferQty;

  const exceedsStock = selectedLot && totalSampleQty > selectedLot.quantity;
  const canSubmit = sourceType && productCode && lotNumber && selectedLot &&
                    testSampleSum > 0 && totalSampleQty > 0 && !exceedsStock && receiveDate;

  const submit = () => {
    if (!canSubmit) return;

    // Revalidate stock against latest persisted state (กัน stale หาก tab อื่นเบิกไปก่อน)
    const masterLot = QUARANTINE_LOTS.find(l => l.productCode === productCode && l.lotNumber === lotNumber);
    if (!masterLot) {
      alert('ไม่พบ lot นี้ในระบบ — กรุณาเลือกใหม่');
      return;
    }
    const overrides = loadLotOverrides();
    const k = `${productCode}|${lotNumber}`;
    const liveQty = overrides[k] !== undefined ? overrides[k] : masterLot.quantity;
    if (liveQty < totalSampleQty) {
      alert(`คงเหลือใน lot ไม่พอ: ${liveQty} ชิ้น (ต้องเบิก ${totalSampleQty})\nอาจมีผู้ใช้อื่นเบิกไปก่อน — โปรด refresh แล้วลองใหม่`);
      setLiveLots(getLiveLots());
      return;
    }

    const reqCode = newReqCode();
    const sampleCode = newSampleCode();
    const now = new Date().toISOString();

    const sample = {
      id: 'qc_' + Date.now(),
      code: sampleCode,
      createdAt: now,
      sourceType,
      sourceRef: sourceRef.trim(),
      productCode,
      productName: selectedProduct?.name || '',
      productNameEn: selectedProduct?.nameEn || '',
      productCategory: selectedProduct?.category || '',
      lotNumber: lotNumber.trim(),
      quantity: String(totalSampleQty),
      unit: 'sample',
      productUnit: selectedProduct?.unit || '',
      mfgDate, expDate, retestDate,
      storageCond,
      receiveDate, note: note.trim(),
      panel: computedTests,
      status: 'received',
      // requisition fields (in-line)
      requisitionCode: reqCode,
      requestedBy: requestedBy.trim(),
      purpose,
      testSampleSum,
      bufferPct,
      bufferQty,
      // Item 3: Retain sample storage
      retainStorage,
      retainShelf,
      retainExpiry,
    };
    const all = loadSamples();
    all.unshift(sample);
    saveSamples(all);

    // ตัดสต็อก quarantine (ใช้ค่า liveQty ที่เพิ่ง revalidate)
    overrides[k] = liveQty - totalSampleQty;
    saveLotOverrides(overrides);

    setShowSuccess(sample);
  };

  return (
    <div className="p-6 lg:p-8 max-w-4xl mx-auto">

      {/* Breadcrumb */}
      <nav className="text-sm text-slate-500 mb-3">
        Quality / QC Entry / <span className="text-slate-700 font-semibold">New</span>
      </nav>

      {/* Header */}
      <div className="flex items-start justify-between mb-6 gap-4 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-xl bg-cyan-100 text-cyan-700 flex items-center justify-center">
            <Icon name="flask" className="w-6 h-6" />
          </div>
          <div>
            <h1 className="text-xl sm:text-2xl font-bold text-slate-900">ลงทะเบียน + ขอเบิกตัวอย่าง QC</h1>
            <p className="text-sm text-slate-500">เบิก lot กักกัน → ตัดสต็อก + ลงทะเบียนตัวอย่างในใบเดียว</p>
          </div>
        </div>
        <button
          onClick={onCancel}
          className="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50"
        >
          <Icon name="back" className="w-4 h-4" /> ยกเลิก
        </button>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      {/* LEFT: Form */}
      <div className="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">

        {/* === Section: ผู้ขอเบิก === */}
        <div className="mb-6">
          <h3 className="text-sm font-bold text-slate-700 mb-3">ผู้ขอเบิก / Request</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div className="field-wrap">
              <label className="field-label">ผู้ขอเบิก</label>
              <input className="field-input" value={requestedBy} onChange={e => setRequestedBy(e.target.value)} />
            </div>
            <div className="field-wrap">
              <label className="field-label">วันที่</label>
              <input type="date" className="field-input" value={receiveDate} onChange={e => setReceiveDate(e.target.value)} />
            </div>
            <div className="field-wrap sm:col-span-2">
              <label className="field-label">วัตถุประสงค์</label>
              <SearchableDropdown
                value={purpose}
                onChange={setPurpose}
                options={PURPOSE_OPTIONS}
                getKey={o => o.value}
                getLabel={o => o.label}
                placeholder="เลือก"
              />
            </div>
          </div>
        </div>

        {/* === Section: Source === */}
        <div className="mb-6">
          <h3 className="text-sm font-bold text-slate-700 mb-3">ที่มาของตัวอย่าง / Source</h3>

              <label className="field-label">อ้างอิง (WO#, Lot#, ฯลฯ)</label>
              <input
                className="field-input"
                value={sourceRef}
                onChange={e => setSourceRef(e.target.value)}
                placeholder="เช่น WO-2569-0142"
              />
            </div>
          </div>
        </div>

        {/* === Section: Product + Lot === */}
        <div className="mb-6">
          <h3 className="text-sm font-bold text-slate-700 mb-3">สินค้า / Lot ที่ขอเบิก</h3>
          <div className="space-y-4">
            <div className="field-wrap">
              <label className="field-label flex items-center gap-1.5 flex-wrap">
                <span>สินค้า (เฉพาะที่มี lot สถานะกักกัน)</span>
                {allowedCategories && (
                  <span className="text-[10px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded-full">
                    ⚡ กรองตาม {allowedCategories.join('+')} ({availableProducts.length} รายการ)
                  </span>
                )}
              </label>
              <SearchableDropdown
                value={productCode}
                onChange={setProductCode}
                options={availableProducts}
                getKey={o => o.code}
                getLabel={o => `${o.code} — ${o.name} / ${o.nameEn}`}
                renderOption={o => (
                  <div className="flex items-baseline gap-2">
                    <code className="text-[11px] font-semibold text-slate-500">{o.code}</code>
                    <span className="text-slate-900">— {o.name}</span>
                    <span className="text-slate-400 text-xs">/ {o.nameEn}</span>
                  </div>

                placeholder={
                  !sourceType
                    ? 'เลือก "ประเภทแหล่งที่มา" ก่อน'

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">

  return (
    <div className="mb-5 rounded-2xl border-2 border-amber-200 bg-gradient-to-br from-amber-50 to-white overflow-hidden">
      <div className="px-4 py-3 flex items-center justify-between cursor-pointer hover:bg-amber-100/40" onClick={() => setCollapsed(!collapsed)}>
        <div className="flex items-center gap-2">
          <span className="text-xl">🔔</span>
          <div>
            <div className="font-bold text-amber-900 text-sm">Pending QC Tasks <span className="ml-1 bg-amber-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{pending.length}</span></div>
            <div className="text-[11px] text-amber-700">ระบบสร้างให้อัตโนมัติจาก trigger ต่าง ๆ — กดเพื่อเริ่มลงทะเบียน</div>
          </div>
        </div>
        <span className="text-amber-700 text-xs font-bold">{collapsed ? '▼ ขยาย' : '▲ ย่อ'}</span>
      </div>
      {!collapsed && (
        <div className="px-4 pb-4 grid grid-cols-1 md:grid-cols-2 gap-2">
          {pending.map(t => {
            const meta = TRIGGER_META[t.triggerType] || TRIGGER_META.gr;
            const palette = {
              cyan:    'bg-cyan-50 border-cyan-300 text-cyan-800',
              emerald: 'bg-emerald-50 border-emerald-300 text-emerald-800',
              violet:  'bg-violet-50 border-violet-300 text-violet-800',
              red:     'bg-red-50 border-red-300 text-red-800',
            }[meta.color];
            const priorityClass = {
              critical: 'bg-red-100 text-red-700',
              high:     'bg-orange-100 text-orange-700',
              medium:   'bg-amber-100 text-amber-700',
              low:      'bg-slate-100 text-slate-700',
            }[t.priority];
            return (
              <div key={t.id} className={`rounded-xl border-2 ${palette} p-3`}>
                <div className="flex items-start gap-2 mb-2">
                  <span className="text-base">{meta.icon}</span>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-1.5 flex-wrap mb-1">
                      <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-white border border-current">{meta.label}</span>
                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${priorityClass}`}>{t.priority.toUpperCase()}</span>
                    </div>
                    <div className="font-semibold text-sm leading-tight">{t.title}</div>
                    <div className="text-[11px] text-slate-600 mt-1 font-mono">
                      {t.productCode} · Lot {t.lotNumber} · {t.sourceRef}
                    </div>
                    <div className="text-[10px] text-slate-500 mt-1">ครบกำหนด: <span className="font-semibold">{t.dueDate}</span></div>
                  </div>
                </div>
                <div className="flex gap-1.5 pt-2 border-t border-current/20">
                  <button onClick={() => onConvert(t)} className="flex-1 px-2 py-1.5 rounded-md bg-white border border-current text-[11px] font-bold hover:bg-current/10">
                    ▶ ลงทะเบียน
                  </button>
                  <button onClick={() => onDismiss(t.id)} className="px-2 py-1.5 rounded-md text-[11px] text-slate-500 hover:bg-white">
                    ✕ ปิด
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

/* ============================ NOTIFICATION BELL ============================ */
const NotificationBell = ({ notifications, onMarkRead }) => {
  const [open, setOpen] = useState(false);
  const unread = notifications.filter(n => !n.read).length;
  const fmtTime = (iso) => {
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'เมื่อสักครู่';
    if (m < 60) return `${m} นาทีที่แล้ว`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h} ชม.ที่แล้ว`;
    return `${Math.floor(h/24)} วันก่อน`;
  };
  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)}
        className="relative w-10 h-10 rounded-lg hover:bg-slate-100 flex items-center justify-center">
        <span className="text-xl">🔔</span>
        {unread > 0 && (
          <span className="absolute top-1 right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">
            {unread > 9 ? '9+' : unread}
          </span>
        )}
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-30" onClick={() => setOpen(false)} />
          <div className="absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-xl shadow-2xl border border-slate-200 z-40 overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
              <div className="font-bold text-sm">การแจ้งเตือน</div>
              {unread > 0 && (
                <button onClick={onMarkRead} className="text-[11px] text-emerald-700 hover:underline font-semibold">อ่านทั้งหมด</button>
              )}
            </div>
            <div className="max-h-96 overflow-y-auto">
              {notifications.length === 0 ? (
                <div className="px-4 py-8 text-center text-slate-400 text-sm">ไม่มีการแจ้งเตือน</div>
              ) : notifications.map(n => (
                <div key={n.id} className={`px-4 py-3 border-b border-slate-50 last:border-0 hover:bg-slate-50 ${!n.read ? 'bg-blue-50/40' : ''}`}>
                  <div className="flex items-start gap-2">
                    {!n.read && <span className="w-1.5 h-1.5 rounded-full bg-blue-500 mt-1.5 flex-shrink-0"></span>}
                    <div className="flex-1">
                      <div className="font-semibold text-sm text-slate-900">{n.title}</div>
                      <div className="text-xs text-slate-600 mt-0.5">{n.msg}</div>
                      <div className="text-[10px] text-slate-400 mt-1">{fmtTime(n.createdAt)}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
};

/* ============================ TOAST ============================ */
const Toast = ({ toast, onClose }) => {
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(onClose, 4000);
    return () => clearTimeout(t);
  }, [toast]);
  if (!toast) return null;
  const palette = {
    success: 'bg-emerald-600',
    info:    'bg-blue-600',
    warn:    'bg-amber-600',
    error:   'bg-red-600',
  }[toast.kind || 'info'];
  return (
    <div className="fixed bottom-6 right-6 z-[100] animate-in slide-in-from-bottom">
      <div className={`${palette} text-white rounded-xl shadow-2xl px-4 py-3 min-w-[280px] max-w-[400px] flex items-start gap-3`}>
        <span className="text-xl flex-shrink-0">{toast.icon || 'ℹ️'}</span>
        <div className="flex-1">
          <div className="font-bold text-sm">{toast.title}</div>
          {toast.msg && <div className="text-xs opacity-90 mt-0.5">{toast.msg}</div>}
        </div>
        <button onClick={onClose} className="text-white/70 hover:text-white flex-shrink-0">✕</button>
      </div>
    </div>
  );
};

const SampleList = ({ samples, onNew, onOpenPrint, tasks, onConvertTask, onDismissTask, notifications, onMarkAllRead }) => {
  const [filter, setFilter] = useState('all');
  const [q, setQ] = useState('');

  const filtered = useMemo(() => {
    let arr = samples;
    if (filter !== 'all') arr = arr.filter(s => s.status === filter);
    if (q.trim()) {
      const s = q.toLowerCase();
      arr = arr.filter(x =>
        x.code.toLowerCase().includes(s) ||
        x.productCode.toLowerCase().includes(s) ||
        x.productName.toLowerCase().includes(s) ||
        x.lotNumber.toLowerCase().includes(s)
      );
    }
    return arr;
  }, [samples, filter, q]);

  const counts = useMemo(() => ({
    all: samples.length,
    received: samples.filter(s => s.status === 'received').length,
    testing:  samples.filter(s => s.status === 'testing').length,
    passed:   samples.filter(s => s.status === 'passed').length,
    failed:   samples.filter(s => s.status === 'failed').length,
  }), [samples]);

  return (
    <div className="p-6 lg:p-8 max-w-7xl mx-auto">

      {/* Breadcrumb */}
      <nav className="text-sm text-slate-500 mb-3">
        Quality / <span className="text-slate-700 font-semibold">QC Entry</span>
      </nav>

      {/* Header */}
      <div className="flex items-start justify-between mb-6 gap-4 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-xl bg-cyan-100 text-cyan-700 flex items-center justify-center">
            <Icon name="flask" className="w-6 h-6" />
          </div>
          <div>
            <h1 className="text-xl sm:text-2xl font-bold text-slate-900">ลงทะเบียนตัวอย่าง QC</h1>
            <p className="text-sm text-slate-500">รายการตัวอย่างที่รับเข้าสำหรับการทดสอบ</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <NotificationBell notifications={notifications} onMarkRead={onMarkAllRead} />
          <button
            onClick={onNew}
            className="inline-flex items-center gap-1.5 px-4 py-2.5 text-sm font-semibold text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 shadow-sm"
          >
            <Icon name="plus" className="w-4 h-4" /> ลงทะเบียนตัวอย่างใหม่
          </button>
        </div>
      </div>

      {/* Item 1: Pending QC Tasks (auto-triggered) */}
      <PendingTasksPanel tasks={tasks} onConvert={onConvertTask} onDismiss={onDismissTask} />

      {/* Filter chips */}
      <div className="flex flex-wrap items-center gap-2 mb-4">
        {[
          { id: 'all',      label: 'ทั้งหมด' },
          { id: 'received', label: 'รับเข้าแล้ว' },
          { id: 'testing',  label: 'กำลังทดสอบ' },
          { id: 'passed',   label: 'ผ่าน' },
          { id: 'failed',   label: 'ไม่ผ่าน' },
        ].map(c => (
          <button
            key={c.id}
            onClick={() => setFilter(c.id)}
            className={`px-3 py-1.5 text-sm font-medium rounded-full border transition-all ${
              filter === c.id
                ? 'bg-emerald-600 text-white border-emerald-600'
                : 'bg-white text-slate-700 border-slate-300 hover:border-emerald-300'
            }`}
          >
            {c.label} <span className="opacity-70">({counts[c.id]})</span>
          </button>
        ))}
        <div className="flex-1 min-w-[200px] relative ml-auto">
          <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
          <input
            value={q}
            onChange={e => setQ(e.target.value)}
            placeholder="ค้นหา code, lot, สินค้า..."
            className="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-emerald-400"
          />
        </div>
      </div>

      {/* Empty state */}
      {filtered.length === 0 ? (
        <div className="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center">
          <div className="w-16 h-16 rounded-2xl bg-slate-100 text-slate-400 mx-auto mb-3 flex items-center justify-center">
            <Icon name="flask" className="w-8 h-8" />
          </div>
          <h3 className="font-bold text-slate-700">ยังไม่มีตัวอย่าง QC</h3>
          <p className="text-sm text-slate-500 mt-1 mb-4">เริ่มลงทะเบียนตัวอย่างแรกของคุณได้เลย</p>
          <button
            onClick={onNew}
            className="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-white bg-emerald-600 rounded-lg hover:bg-emerald-700"
          >
            <Icon name="plus" className="w-4 h-4" /> ลงทะเบียนตัวอย่างใหม่
          </button>
        </div>
      ) : (
        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 border-b border-slate-200">
                <tr className="text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                  <th className="px-4 py-3">QC / SR</th>
                  <th className="px-4 py-3">สินค้า / Lot</th>
                  <th className="px-4 py-3">ที่มา</th>
                  <th className="px-4 py-3">จำนวนเบิก</th>
                  <th className="px-4 py-3">วันที่</th>
                  <th className="px-4 py-3">Test</th>
                  <th className="px-4 py-3">สถานะ</th>
                  <th className="px-4 py-3"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {filtered.map(s => (
                  <tr key={s.id} className="hover:bg-slate-50">
                    <td className="px-4 py-3">
                      <div className="font-semibold text-emerald-700">{s.code}</div>
                      {s.requisitionCode && <div className="text-[11px] text-slate-500 font-mono">{s.requisitionCode}</div>}
                      <div className="text-[10px] text-slate-400">{fmtTime(s.createdAt)}</div>
                    </td>
                    <td className="px-4 py-3">
                      <div className="font-medium">{s.productCode}</div>
                      <div className="text-xs text-slate-500 truncate max-w-[220px]">{s.productName}</div>
                      <div className="text-[11px] text-slate-400">Lot: <span className="font-mono">{s.lotNumber}</span></div>
                    </td>
                    <td className="px-4 py-3">
                      <div className="text-xs text-slate-600">{SOURCE_LABEL[s.sourceType]}</div>
                      {s.sourceRef && <div className="text-[11px] text-slate-400 font-mono">{s.sourceRef}</div>}
                    </td>
                    <td className="px-4 py-3">
                      <div className="font-semibold">{s.quantity} <span className="text-slate-500 font-normal text-xs">ชิ้น</span></div>
                      {s.bufferQty != null && <div className="text-[10px] text-slate-400">+{s.bufferQty} buffer</div>}
                    </td>
                    <td className="px-4 py-3 text-slate-600 text-xs">{fmtDate(s.receiveDate)}</td>
                    <td className="px-4 py-3">
                      {s.panel.length > 0 ? (
                        <span className="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md">{s.panel.length} test</span>
                      ) : (
                        <span className="text-xs text-slate-400">—</span>
                      )}
                    </td>
                    <td className="px-4 py-3"><StatusBadge status={s.status} /></td>
                    <td className="px-4 py-3">
                      {s.requisitionCode && (
                        <button
                          onClick={() => onOpenPrint(s)}
                          className="text-slate-400 hover:text-emerald-600 p-1"
                          title="ดู/พิมพ์ใบขอเบิก"
                        >
                          <Icon name="print" className="w-4 h-4" />
                        </button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
};

/* ============================ APP ============================ */
const App = () => {
  const [view, setView] = useState('list'); // list | new | print
  const [samples, setSamples] = useState(() => loadSamples());
  const [activeSample, setActiveSample] = useState(null);
  const [tasks, setTasks] = useState(() => loadTasks());
  const [notifications, setNotifications] = useState(() => loadNotifications());
  const [toast, setToast] = useState(null);
  const [prefill, setPrefill] = useState(null);

  const refresh = () => setSamples(loadSamples());

  const fireToast = (toast) => setToast(toast);

  const convertTask = (task) => {
    // Mark task as converted + prefill new form
    const updated = tasks.map(t => t.id === task.id ? { ...t, status: 'converted' } : t);
    setTasks(updated);
    saveTasks(updated);
    setPrefill({
      productCode: task.productCode,
      lotNumber:   task.lotNumber,
      sourceRef:   task.sourceRef,
      triggerType: task.triggerType,
    });
    fireToast({ kind: 'info', icon: '▶', title: 'เริ่มลงทะเบียนจาก trigger', msg: `${task.lotNumber} (${task.sourceRef})` });
    setView('new');
  };
  const dismissTask = (taskId) => {
    const updated = tasks.map(t => t.id === taskId ? { ...t, status: 'dismissed' } : t);
    setTasks(updated);
    saveTasks(updated);
    fireToast({ kind: 'warn', icon: '✕', title: 'ปิด task แล้ว', msg: 'task ถูกซ่อนจากรายการ' });
  };
  const markAllNotifRead = () => {
    const updated = notifications.map(n => ({ ...n, read: true }));
    setNotifications(updated);
    saveNotifications(updated);
  };

  return (
    <div className="flex min-h-screen bg-slate-50">
      <div className="hidden lg:block no-print">
        <Sidebar active="qc-entry" />
      </div>
      <main className="flex-1 min-w-0">
        {view === 'list' && (
          <SampleList
            samples={samples}
            tasks={tasks}
            notifications={notifications}
            onConvertTask={convertTask}
            onDismissTask={dismissTask}
            onMarkAllRead={markAllNotifRead}
            onNew={() => { setPrefill(null); setView('new'); }}
            onOpenPrint={(s) => { setActiveSample(s); setView('print'); }}
          />
        )}
        {view === 'new' && (
          <NewSampleForm
            prefill={prefill}
            onCancel={() => { setPrefill(null); setView('list'); }}
            onSaved={(saved) => {
              refresh();
              setPrefill(null);
              // Add notification: QC entry created
              if (saved) {
                const updated = addNotification({ kind: 'created', title: '✅ ลงทะเบียนสำเร็จ', msg: `${saved.code} · ${saved.productCode} · Lot ${saved.lotNumber}`, to: 'qc' });
                setNotifications(updated);
                fireToast({ kind: 'success', icon: '✓', title: 'ลงทะเบียนสำเร็จ', msg: saved.code });
              }
              setView('list');
            }}
            onPrint={(s) => { refresh(); setActiveSample(s); setView('print'); }}
          />
        )}
        {view === 'print' && activeSample && (
          <RequisitionPrint
            sample={activeSample}
            onBack={() => setView('list')}
          />
        )}
      </main>
      <Toast toast={toast} onClose={() => setToast(null)} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
