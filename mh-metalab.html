  .main-nav .nav-dropdown a:hover { background: #f0fdf4 !important; color: #26713e !important; }
  .main-nav .nav-dropdown a.active { background: #319754 !important; color: white !important; margin: 0; }
  .main-nav { overflow: visible !important; }
  .main-nav > div { overflow: visible !important; }
  .settings-pop { position: absolute; top: calc(100% + 8px); right: 0; background: white; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 12px 32px -8px rgba(0,0,0,.2); width: 320px; padding: 16px; z-index: 60; }
  .switch { position: relative; width: 44px; height: 24px; background: #e5e7eb; border-radius: 9999px; cursor: pointer; transition: background .15s; flex-shrink: 0; }
  .switch.on { background: #319754; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on::after { transform: translateX(20px); }
  .prog-card { transition: all .2s; }
  .prog-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -10px rgba(22,163,74,.18); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  .filter-pill { padding: 6px 14px; border-radius: 9999px; font-size: 12px; font-weight: 600; border: 2px solid; transition: all .15s; cursor: pointer; }

  .filter-pill:not(.active) { background: white; color: #4b5563; border-color: #e5e7eb; }

/* ============================ PROGRAM CARD ============================ */
function ProgramCard({ p, onOpen }) {

  const c = colorPalette[p.color];
  const urgent = parseInt(p.closesIn) <= 5;
  return (
    <div className="prog-card bg-white rounded-2xl border-2 border-stone-200 overflow-hidden cursor-pointer" onClick={() => onOpen(p)}>
      {/* Hero strip (พื้นขาว) */}

        <div className="flex items-center justify-between gap-2">
          <div className="flex items-center gap-3 min-w-0">
            <span className={`chip ${c.bg} ${c.text} border ${c.border} flex-shrink-0`}>
              {p.categoryLabel}
            </span>
            <div className={`w-14 h-14 rounded-2xl ${c.bg} flex items-center justify-center text-3xl shadow-sm flex-shrink-0`}>{p.emoji}</div>
          </div>
          {urgent && (
            <span className="chip bg-red-500 text-white animate-pulse flex-shrink-0">
              🔥 ปิดรับใน {p.closesIn}
            </span>
          )}
        </div>
      </div>

      {/* Body */}
      <div className="p-5">
        <h3 className="font-bold text-lg leading-tight mb-1">{p.title}</h3>
        <div className="text-xs text-stone-500 mb-3">{p.brand}</div>
        <p className="text-sm text-stone-600 line-clamp-2 mb-4 leading-relaxed">{p.description}</p>

        {/* Meta */}
        <div className="grid grid-cols-3 gap-2 mb-4 pb-4 border-b border-stone-100">
          <div>
            <div className="text-[10px] font-bold text-stone-400 uppercase tracking-wider">ระยะเวลา</div>
            <div className="font-bold text-sm">{p.duration} วัน</div>
          </div>
          <div>
            <div className="text-[10px] font-bold text-stone-400 uppercase tracking-wider">เริ่ม</div>
            <div className="font-bold text-sm">{p.startDate.split(' ').slice(0,2).join(' ')}</div>
          </div>
          <div>
            <div className="text-[10px] font-bold text-stone-400 uppercase tracking-wider">รางวัล</div>
            <div className="font-bold text-sm text-amber-700">{p.rewards.points} pts</div>

          สมัครเข้าร่วม →

    </div>

/* ============================ DETAIL MODAL ============================ */

    <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-3" onClick={onClose}>
      <div className="bg-white max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-3xl shadow-2xl" onClick={e => e.stopPropagation()}>
        {/* Hero (พื้นขาว) */}
        <div className="bg-white px-6 py-8 relative border-b border-stone-100">
          <button onClick={onClose} className="absolute top-4 right-4 w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 flex items-center justify-center text-stone-600 text-xl">✕</button>
          <div className={`w-20 h-20 rounded-2xl ${c.bg} flex items-center justify-center text-5xl shadow-sm mb-4`}>{program.emoji}</div>
          <span className={`chip ${c.bg} ${c.text} border ${c.border}`}>{program.categoryLabel}</span>
          <h2 className="heading-display text-2xl mt-3 mb-1">{program.title}</h2>
          <div className="text-sm text-stone-700">{program.brand}</div>
        </div>

        {/* Body */}
        <div className="p-6 space-y-6">
          <p className="text-stone-700 leading-relaxed">{program.description}</p>

          {/* Stats */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 p-4 bg-stone-50 rounded-2xl">
            <div>
              <div className="text-[11px] font-bold text-stone-400 uppercase tracking-wider">ระยะ</div>
              <div className="font-bold text-lg">{program.duration} วัน</div>
            </div>
            <div>
              <div className="text-[11px] font-bold text-stone-400 uppercase tracking-wider">เริ่ม</div>
              <div className="font-bold text-lg">{program.startDate}</div>
            </div>
            <div>
              <div className="text-[11px] font-bold text-stone-400 uppercase tracking-wider">รับ</div>
              <div className="font-bold text-lg">{program.capacity} คน</div>
            </div>
            <div>
              <div className="text-[11px] font-bold text-stone-400 uppercase tracking-wider">ปิดรับใน</div>
              <div className="font-bold text-lg text-red-600">{program.closesIn}</div>
            </div>
          </div>

          {/* Target groups */}
          <div>
            <div className="text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">🎯 เหมาะกับกลุ่ม</div>
            <div className="flex flex-wrap gap-2">
              {program.targetGroups.map((g, i) => (
                <span key={i} className={`chip ${c.bg} ${c.text} border ${c.border}`}>{g}</span>
              ))}
            </div>
          </div>

          {/* Requirements */}
          <div>
            <div className="text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">✓ คุณสมบัติ</div>
            <ul className="space-y-1.5">
              {program.requirements.map((r, i) => (
                <li key={i} className="flex gap-2 text-sm text-stone-700"><span className="text-green-600">✓</span> {r}</li>
              ))}
            </ul>
          </div>

          {/* Survey stages */}
          <div>
            <div className="text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">📋 Survey 3 ระยะ</div>
            <div className="grid grid-cols-3 gap-2">
              <div className="text-center p-3 bg-amber-50 border border-amber-200 rounded-xl">
                <div className="text-2xl mb-1">A</div>
                <div className="text-[11px] font-bold text-amber-700">ก่อนใช้</div>
              </div>
              <div className="text-center p-3 bg-blue-50 border border-blue-200 rounded-xl">
                <div className="text-2xl mb-1">B</div>
                <div className="text-[11px] font-bold text-blue-700">ระหว่างใช้</div>
              </div>
              <div className="text-center p-3 bg-green-50 border border-green-200 rounded-xl">
                <div className="text-2xl mb-1">C</div>
                <div className="text-[11px] font-bold text-green-700">หลังจบ</div>
              </div>
            </div>
          </div>

          {/* Rewards */}
          <div className="bg-gradient-to-br from-amber-50 to-orange-50 border-2 border-amber-200 rounded-2xl p-4">
            <div className="flex items-center gap-2 mb-3">
              <span className="text-2xl">🏆</span>
              <div className="font-bold">รางวัลที่จะได้</div>
            </div>
            <div className="flex items-center gap-3">
              <div>
                <div className="text-[11px] font-bold text-amber-700 uppercase">คะแนน</div>
                <div className="font-extrabold text-2xl text-amber-700">{program.rewards.points}</div>
              </div>
              <div className="flex-1 pl-4 border-l border-amber-300">
                <div className="text-[11px] font-bold text-amber-700 uppercase mb-0.5">โบนัส</div>
                <div className="text-sm text-stone-700">{program.rewards.bonus}</div>
              </div>
            </div>
          </div>

          {/* Progress */}
          <div>
            <div className="flex items-center justify-between text-sm mb-1.5">
              <span><b>{program.applied}</b> / {program.capacity} สมัครแล้ว</span>
              <span className="text-stone-500 font-mono">{pct}%</span>
            </div>
            <div className="h-3 bg-stone-100 rounded-full overflow-hidden">
              <div className={`h-full ${c.solid}`} style={{ width: pct + '%' }}></div>
            </div>
          </div>

          {/* CTA */}
          <div className="flex gap-2 pt-2">
            <button onClick={onClose} className="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold py-3 rounded-xl">ปิด</button>
            <a href={`mh-tester.html?enroll=${program.id}`}
              className={`flex-[2] text-center ${c.solid} hover:opacity-90 text-white font-bold py-3 rounded-xl shadow-lg`}>
              สมัครเข้าร่วมโปรแกรม →
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================ APP ============================ */
function App() {
  const [category, setCategory] = useState('all');
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState('closing');
  const [selected, setSelected] = useState(null);

  const filtered = useMemo(() => {
    let arr = [...PROGRAMS];
    if (category !== 'all') arr = arr.filter(p => p.category === category);
    if (search.trim()) {
      const s = search.toLowerCase();
      arr = arr.filter(p =>
        p.title.toLowerCase().includes(s) ||
        p.brand.toLowerCase().includes(s) ||
        p.description.toLowerCase().includes(s)
      );
    }
    if (sort === 'closing') arr.sort((a, b) => parseInt(a.closesIn) - parseInt(b.closesIn));
    if (sort === 'popular') arr.sort((a, b) => (b.applied / b.capacity) - (a.applied / a.capacity));
    if (sort === 'reward')  arr.sort((a, b) => b.rewards.points - a.rewards.points);
    return arr;
  }, [category, search, sort]);

  return (
    <div className="min-h-screen">
      <Header />

      {/* Hero strip */}
      <section className="bg-gradient-to-br from-green-50 to-white border-b border-gray-200">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
          <div className="text-xs font-bold uppercase tracking-widest text-green-700 mb-2">METALAB</div>
          <h1 className="heading-display text-3xl sm:text-4xl mb-2">Active Beta Programs</h1>
          <p className="text-gray-600 max-w-2xl">เลือกโปรแกรมที่เหมาะกับคุณ ทดลองสินค้าฟรี + ตอบ survey เพื่อสะสมแต้ม</p>

          <div className="mt-6 grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl">
            <div className="bg-white rounded-xl p-3 border border-gray-200">
              <div className="text-xs text-gray-500">โปรแกรมเปิดอยู่</div>
              <div className="font-extrabold text-xl text-green-700">{PROGRAMS.length}</div>
            </div>
            <div className="bg-white rounded-xl p-3 border border-gray-200">
              <div className="text-xs text-gray-500">รับ tester รวม</div>
              <div className="font-extrabold text-xl">{PROGRAMS.reduce((s,p)=>s+p.capacity,0)}</div>
            </div>
            <div className="bg-white rounded-xl p-3 border border-gray-200">
              <div className="text-xs text-gray-500">สมัครแล้ว</div>
              <div className="font-extrabold text-xl text-green-700">{PROGRAMS.reduce((s,p)=>s+p.applied,0)}</div>
            </div>
            <div className="bg-white rounded-xl p-3 border border-gray-200">
              <div className="text-xs text-gray-500">รางวัลรวม</div>
              <div className="font-extrabold text-xl text-amber-600">{PROGRAMS.reduce((s,p)=>s+p.rewards.points,0).toLocaleString()} pts</div>
            </div>
          </div>
        </div>
      </section>

      {/* Search + filter */}
      <section className="bg-white border-b border-gray-200 sticky top-[60px] z-30">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3">
          <div className="flex gap-3 items-center mb-3 flex-wrap">
            <div className="relative flex-1 min-w-[200px]">
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="ค้นหาโปรแกรม / brand / สินค้า..."
                className="w-full pl-10 pr-3 py-2.5 text-sm border border-gray-200 rounded-full focus:outline-none focus:border-green-500"
              />
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
            </div>
            <select value={sort} onChange={e => setSort(e.target.value)}
              className="text-sm border border-gray-200 rounded-full px-4 py-2.5 bg-white cursor-pointer focus:outline-none focus:border-green-500">
              <option value="closing">ปิดรับเร็วสุด</option>
              <option value="popular">นิยมสุด</option>
              <option value="reward">รางวัลสูงสุด</option>
            </select>
          </div>
          <div className="flex flex-wrap gap-2 overflow-x-auto pb-1">
            {CATEGORIES.map(cat => (
              <button key={cat.id} onClick={() => setCategory(cat.id)}
                className={`filter-pill ${category === cat.id ? 'active' : ''} whitespace-nowrap`}>
                {cat.label} {cat.count !== undefined && <span className="ml-1 opacity-70">({cat.count})</span>}
              </button>
            ))}
          </div>
        </div>
      </section>

      {/* Programs grid */}
      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        {filtered.length === 0 ? (
          <div className="text-center py-16">
            <div className="text-6xl mb-3">🔍</div>
            <div className="font-bold text-lg text-stone-700">ไม่พบโปรแกรมที่ตรงกับเงื่อนไข</div>
            <div className="text-sm text-stone-500 mt-1">ลองเปลี่ยน filter หรือ search ใหม่</div>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {filtered.map(p => <ProgramCard key={p.id} p={p} onOpen={setSelected} />)}
          </div>
        )}
      </main>

      <DetailModal program={selected} onClose={() => setSelected(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
