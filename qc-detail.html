<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QC Detail — Sample Recording</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brand: #10b981; --brand-dark: #047857; }
  html, body, #root { height: 100%; }
  body { font-family: 'Inter', 'Sarabun', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
  .panel { background: white; border: 1px solid #e2e8f0; border-radius: 14px; }
  .field-input {
    width: 100%; padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 10px;
    background: #fff; font-size: 14px; outline: none; transition: all .15s ease;
  }
  .field-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
  .field-input:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }
  .btn { padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--brand); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--brand-dark); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: white; border: 1px solid #e2e8f0; color: #475569; }
  .btn-ghost:hover { background: #f8fafc; }
  .btn-danger { background: #fee2e2; color: #991b1b; }
  .btn-danger:hover { background: #fecaca; }

  /* status bar */
  .stage-node { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; transition: all .2s; }
  .stage-done   { background: #10b981; color: white; }
  .stage-active { background: white; color: #047857; border: 3px solid #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,.15); }
  .stage-todo   { background: white; color: #cbd5e1; border: 2px solid #e2e8f0; }
  .stage-line   { flex: 1; height: 2px; background: #e2e8f0; }
  .stage-line.done { background: #10b981; }

  /* test list item */
  .test-row { padding: 12px 14px; border-radius: 10px; cursor: pointer; transition: all .12s; border: 1px solid transparent; }
  .test-row:hover { background: #f8fafc; }
  .test-row.active { background: #ecfdf5; border-color: #10b981; }

  /* scrollbar */
  .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .scrollbar::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

/* ============================ ICONS ============================ */
const Icon = ({ name, className = "w-4 h-4" }) => {
  const i = {
    check:    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>,
    x:        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>,
    back:     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>,
    alert:    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
    play:     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
    plus:     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>,
    refresh:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15A9 9 0 1 1 5.64 5.64L1 10"/></svg>,
    flask:    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 3h6v4l5 9a3 3 0 0 1-3 5H7a3 3 0 0 1-3-5l5-9V3z"/><path d="M9 3h6"/></svg>,
    dice:     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>,
    package:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
    file:     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
    user:     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
    clock:    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
    print:    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
    link:     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>,
  };
  return <span className={className}>{i[name]}</span>;
};

/* ============================ DEMO DATA ============================ */
const SAMPLE = {
  sampleNo: 'QC-2026-000011',
  product: { code: 'FG-FIN-003', name: 'แคปซูลขิงแก่ 300mg (60 แคปซูล/กล่อง)' },
  lot: 'FG-FIN-003-2605',
  source: 'ใบสั่งผลิต WO-2026-0142',
  receivedDate: '20 พ.ค. 2569',
  receivedBy: 'System Administrator',
  panel: 'FG Capsule Release Panel',
  stockTotal: 50000,
};

const TESTS_TEMPLATE = [
  { id: 't1', name: 'Appearance',     thai: 'ลักษณะภายนอก',     method: 'Visual / TP 5.1',         type: 'pass_fail',  spec: 'แคปซูลสีน้ำตาลอ่อน ไม่บุบ ไม่แตก',                              required: true,  equipment: 'Visual',          decimals: 0 },
  { id: 't2', name: 'Identification', thai: 'การพิสูจน์เอกลักษณ์', method: 'TLC / USP <201>',         type: 'pass_fail',  spec: 'Rf ตรงกับ standard',                                                required: true,  equipment: 'TLC-PLATE',       decimals: 0 },
  { id: 't3', name: 'pH Value',       thai: 'ค่า pH',            method: 'USP <791>',                type: 'numeric',    spec: '6.0 – 7.5',                                                          required: true,  equipment: 'pH-METER-01',     decimals: 2, min: 6.0, max: 7.5, unit: 'pH' },
  { id: 't4', name: 'Assay',          thai: 'ปริมาณสารสำคัญ',     method: 'HPLC / In-house QC-A-024', type: 'numeric',    spec: '90.0 – 110.0 %',                                                     required: true,  equipment: 'HPLC-02',         decimals: 2, min: 90.0, max: 110.0, unit: '%' },
  { id: 't5', name: 'Microbial Limit',thai: 'จุลินทรีย์ปนเปื้อน', method: 'USP <61>',                 type: 'numeric',    spec: '≤ 1000 cfu/g',                                                       required: true,  equipment: 'INCUBATOR-A',     decimals: 0, max: 1000, unit: 'cfu/g' },
];

const SAMPLING_PLAN = {
  method: 'random',
  methodLabel: 'Random Sampling — สุ่มทั่วไป',
  reference: 'USP <905> · TP 8.3',
  baseSize: 20,
  unit: 'capsules',
  stages: [
    { id: 1, size: 10, tolerance: 0,  desc: 'Stage 1 — สุ่ม 10 แคปซูลแรก' },
    { id: 2, size: 20, tolerance: 0,  desc: 'Stage 2 — ถ้า fail → สุ่มเพิ่ม 20 แคปซูล' },
  ],
};

/* ============================ UTILITIES ============================ */
const nowTime = () => new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
const nowFull = () => new Date().toLocaleString('th-TH', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short' });

/* ============================ STATUS BAR ============================ */
function StatusBar({ stage, timestamps, hasOOS }) {
  // Item 6: Dual Approval — Released = QC Released → Warehouse Verified
  const stages = [
    { key: 'registered',   label: 'Registered',  num: 1 },
    { key: 'draft',        label: 'Draft',       num: 2 },
    { key: 'in_progress',  label: 'In Progress', num: 3 },
    { key: 'approved',     label: 'Approved',    num: 4 },
    { key: 'qc_released',  label: 'QC Released', num: '5a', byPersona: 'QC' },
    { key: 'wh_verified',  label: 'WH Verified', num: '5b', byPersona: 'Warehouse' },
  ];
  const currentIdx = stages.findIndex(s => s.key === stage);

  return (
    <div className="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3">
        <div className="flex items-center gap-1.5 sm:gap-2">
          {stages.map((s, i) => {
            const status = i < currentIdx ? 'done' : i === currentIdx ? 'active' : 'todo';
            return (
              <React.Fragment key={s.key}>
                <div className="flex flex-col items-center gap-1 flex-shrink-0" style={{ minWidth: 64 }}>
                  <div className={`stage-node stage-${status}`}>
                    {status === 'done' ? <Icon name="check" className="w-4 h-4" /> : s.num}
                  </div>
                  <div className={`text-[10px] sm:text-[11px] font-semibold ${
                    status === 'active' ? 'text-emerald-700' : status === 'done' ? 'text-slate-700' : 'text-slate-400'
                  }`}>{s.label}</div>
                  {s.byPersona && (
                    <div className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${
                      s.byPersona === 'QC' ? 'bg-violet-100 text-violet-700' : 'bg-amber-100 text-amber-700'
                    }`}>by {s.byPersona}</div>
                  )}
                  {timestamps[s.key] && (
                    <div className="text-[9px] text-slate-400 -mt-0.5">{timestamps[s.key]}</div>
                  )}
                </div>
                {i < stages.length - 1 && (
                  <div className={`stage-line ${i < currentIdx ? 'done' : ''}`}></div>
                )}
              </React.Fragment>
            );
          })}
          {hasOOS && (
            <div className="ml-2 inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-100 text-red-700 border border-red-300 text-[11px] font-semibold flex-shrink-0">
              <Icon name="alert" className="w-3 h-3" /> OOS
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================ SAMPLING PLAN CARD ============================ */
function SamplingPlanCard({ stage, sampling, onConfirm, onReverse }) {
  const [confirmOpen, setConfirmOpen] = useState(false);
  const planSize = sampling.confirmed ? sampling.deducted : SAMPLING_PLAN.baseSize;
  const canReverse = stage === 'draft';
  const remaining = SAMPLE.stockTotal - (sampling.confirmed ? planSize : 0);

  return (
    <div className="panel p-4">
      <div className="flex items-center gap-2 mb-3 pb-2 border-b border-slate-100">
        <div className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
          <Icon name="dice" className="w-4 h-4" />
        </div>
        <div className="flex-1">
          <h3 className="font-bold text-slate-900 text-sm">Sampling Plan</h3>
          <p className="text-[11px] text-slate-500">{SAMPLING_PLAN.reference}</p>
        </div>
        {sampling.confirmed && (
          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-300">
            ✓ ตัด stock แล้ว
          </span>
        )}
      </div>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <div>
          <div className="text-[10px] uppercase tracking-wide text-slate-500 font-semibold mb-0.5">วิธีสุ่ม</div>
          <div className="text-sm font-semibold text-slate-800">{SAMPLING_PLAN.methodLabel}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-wide text-slate-500 font-semibold mb-0.5">จำนวนตัวอย่าง</div>
          <div className="text-sm font-bold text-emerald-700">{planSize} {SAMPLING_PLAN.unit}</div>
        </div>
      </div>

      {/* Multi-stage chart */}
      <div className="mb-3">
        <div className="text-[10px] uppercase tracking-wide text-slate-500 font-semibold mb-1.5">Multi-stage</div>
        <div className="space-y-1.5">
          {SAMPLING_PLAN.stages.map((st, idx) => (
            <div key={st.id} className="flex items-center gap-2 text-[11px]">
              <span className={`w-5 h-5 rounded-md flex items-center justify-center font-bold text-[10px] flex-shrink-0 ${
                idx === 0 ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'
              }`}>S{st.id}</span>
              <span className="flex-1 text-slate-700">{st.desc}</span>
              <span className="font-mono font-bold text-slate-600">{st.size}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Stock deduction widget */}
      <div className={`rounded-lg border p-3 ${sampling.confirmed ? 'bg-emerald-50/60 border-emerald-200' : 'bg-slate-50 border-slate-200'}`}>
        <div className="flex items-center gap-2 mb-2">
          <Icon name="package" className="w-4 h-4 text-slate-600" />
          <div className="text-[11px] font-bold text-slate-700">Stock Lot {SAMPLE.lot}</div>
        </div>
        <div className="space-y-1 mb-3">
          <div className="flex justify-between text-[11px]">
            <span className="text-slate-500">คงเหลือก่อน</span>
            <span className="font-mono font-semibold text-slate-700">{SAMPLE.stockTotal.toLocaleString()}</span>
          </div>
          {sampling.confirmed && (
            <div className="flex justify-between text-[11px]">
              <span className="text-red-600">หัก QC sample</span>
              <span className="font-mono font-semibold text-red-700">−{planSize.toLocaleString()}</span>
            </div>
          )}
          <div className="flex justify-between text-[11px] pt-1 border-t border-slate-200">
            <span className="text-slate-700 font-semibold">คงเหลือหลังตัด</span>
            <span className={`font-mono font-bold ${sampling.confirmed ? 'text-emerald-700' : 'text-slate-700'}`}>
              {remaining.toLocaleString()}
            </span>
          </div>
        </div>

        {!sampling.confirmed ? (
          <button onClick={() => setConfirmOpen(true)}
            className="btn btn-primary w-full justify-center">
            <Icon name="dice" className="w-4 h-4" />
            ยืนยันสุ่มตัวอย่าง · ตัด {planSize} {SAMPLING_PLAN.unit}
          </button>
        ) : (
          <div className="space-y-1.5">
            <div className="text-[10px] text-emerald-700 font-mono leading-tight">
              {sampling.txnRef} · {sampling.confirmedAt}<br/>
              by {sampling.confirmedBy}
            </div>
            {canReverse ? (
              <button onClick={onReverse}
                className="btn btn-ghost w-full justify-center text-xs">
                <Icon name="refresh" className="w-3.5 h-3.5" />
                ยกเลิก sampling · คืน stock {planSize}
              </button>
            ) : (
              <div className="text-[10px] text-slate-500 italic">
                เริ่มทดสอบแล้ว — reverse ไม่ได้
              </div>
            )}
          </div>
        )}
      </div>

      {/* Confirm modal */}
      {confirmOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setConfirmOpen(false)}>
          <div className="bg-white max-w-md w-full rounded-2xl shadow-2xl p-6" onClick={e => e.stopPropagation()}>
            <div className="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mb-4">
              <Icon name="alert" className="w-6 h-6" />
            </div>
            <h3 className="text-lg font-bold text-slate-900 mb-2">ยืนยันการสุ่มตัวอย่าง?</h3>
            <p className="text-sm text-slate-600 mb-4">
              ระบบจะตัด <span className="font-bold text-red-700">{planSize} {SAMPLING_PLAN.unit}</span> ออกจาก Lot <span className="font-mono font-bold">{SAMPLE.lot}</span>
            </p>
            <ul className="text-[12px] text-slate-600 space-y-1 mb-5 bg-slate-50 rounded-lg p-3">
              <li>• Stock movement → <span className="font-mono">QC Lab Consumption</span></li>
              <li>• Reference: <span className="font-mono font-bold">{SAMPLE.sampleNo}</span></li>
              <li>• Stage จะเปลี่ยน Registered → Draft</li>
              <li>• ยกเลิกได้ก่อนเริ่มทดสอบเท่านั้น</li>
            </ul>
            <div className="flex gap-2">
              <button onClick={() => setConfirmOpen(false)} className="btn btn-ghost flex-1 justify-center">ยกเลิก</button>
              <button onClick={() => { onConfirm(); setConfirmOpen(false); }} className="btn btn-primary flex-1 justify-center">ยืนยัน</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================ TEST LIST ============================ */
function TestList({ tests, activeId, onSelect, samplingConfirmed }) {
  if (!samplingConfirmed) {
    return (
      <div className="panel p-4">
        <h3 className="font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
          <Icon name="flask" className="w-4 h-4 text-slate-400" />
          Test Panel
        </h3>
        <div className="text-center py-6 text-slate-400 text-xs">
          🔒 รอยืนยัน Sampling Plan ก่อน
        </div>
      </div>
    );
  }
  const statusIcon = {
    pass:     { icon: '✓', color: 'bg-emerald-100 text-emerald-700' },
    fail:     { icon: '✕', color: 'bg-red-100 text-red-700' },
    progress: { icon: '⏵', color: 'bg-amber-100 text-amber-700' },
    todo:     { icon: '○', color: 'bg-slate-100 text-slate-400' },
  };
  return (
    <div className="panel p-3">
      <div className="flex items-center justify-between mb-3 px-1">
        <h3 className="font-bold text-slate-900 text-sm flex items-center gap-2">
          <Icon name="flask" className="w-4 h-4 text-emerald-600" />
          Test Panel
        </h3>
        <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
          {tests.filter(t => t.status !== 'todo').length}/{tests.length}
        </span>
      </div>

      <div className="space-y-1">
        {tests.map(t => {
          const st = statusIcon[t.status] || statusIcon.todo;
          return (
            <div key={t.id} onClick={() => onSelect(t.id)}
              className={`test-row ${activeId === t.id ? 'active' : ''}`}>
              <div className="flex items-center gap-2.5">
                <span className={`w-7 h-7 rounded-md flex items-center justify-center font-bold text-sm flex-shrink-0 ${st.color}`}>
                  {st.icon}
                </span>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-sm text-slate-900 truncate">{t.name}</div>
                  <div className="text-[10px] text-slate-500 truncate">
                    {t.status === 'pass' && `Pass · ${t.completedAt || ''}`}
                    {t.status === 'fail' && `OOS · ${t.completedAt || ''} ⚠`}
                    {t.status === 'progress' && 'In progress'}
                    {t.status === 'todo' && 'Not started'}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="mt-3 pt-3 border-t border-slate-100 space-y-1">
        <button className="w-full text-left px-2 py-1.5 rounded-md hover:bg-slate-50 text-[12px] text-slate-600 font-medium flex items-center gap-1.5">
          <Icon name="plus" className="w-3.5 h-3.5" /> Add ad-hoc test
        </button>
        <button className="w-full text-left px-2 py-1.5 rounded-md hover:bg-slate-50 text-[12px] text-slate-600 font-medium flex items-center gap-1.5">
          <Icon name="refresh" className="w-3.5 h-3.5" /> Re-sample
        </button>
      </div>
    </div>
  );
}

/* ============================ TEST DETAIL ============================ */
function TestDetail({ test, onSave, onDiscard, onNext, samplingConfirmed }) {
  const [reading, setReading] = useState(test.reading || '');
  const [replicate, setReplicate] = useState(test.replicate || 1);
  const [analyst, setAnalyst] = useState(test.analyst || 'PA สมหญิง');
  const [equipment, setEquipment] = useState(test.equipment || test.equipmentDefault || '');
  const [note, setNote] = useState(test.note || '');
  const [oosModal, setOosModal] = useState(null);

  useEffect(() => {
    setReading(test.reading || '');
    setReplicate(test.replicate || 1);
    setAnalyst(test.analyst || 'PA สมหญิง');
    setEquipment(test.equipment || test.equipmentDefault || '');
    setNote(test.note || '');
  }, [test.id]);

  if (!samplingConfirmed) {
    return (
      <div className="panel p-8 text-center text-slate-400">
        <div className="text-4xl mb-3">🔒</div>
        <div className="font-semibold text-slate-600 mb-1">รอยืนยัน Sampling Plan</div>
        <div className="text-xs">กดปุ่ม "ยืนยันสุ่มตัวอย่าง" ในการ์ดด้านบน เพื่อตัด stock และเริ่มทดสอบ</div>
      </div>
    );
  }

  // Live spec check for numeric
  const r = parseFloat(reading);
  const hasReading = !isNaN(r);
  const minOK = test.min === undefined || r >= test.min;
  const maxOK = test.max === undefined || r <= test.max;
  const inRange = hasReading && minOK && maxOK;

  const handleSave = (passOverride) => {
    if (test.type === 'numeric' && hasReading && !inRange && !passOverride) {
      setOosModal({ value: r });
      return;
    }
    onSave({
      reading, replicate, analyst, equipment, note,
      status: passOverride === 'oos' ? 'fail' : (test.type === 'pass_fail' ? passOverride : 'pass'),
      completedAt: nowTime(),
    });
  };

  return (
    <div>
      <div className="panel p-4 sm:p-5">
        <div className="flex items-start justify-between gap-3 mb-4 pb-3 border-b border-slate-100">
          <div className="flex-1 min-w-0">
            <h2 className="text-lg font-bold text-slate-900">{test.name}</h2>
            <p className="text-xs text-slate-500">{test.thai} · {test.method}</p>
          </div>
          <span className={`text-[10px] font-bold px-2 py-1 rounded-full ${
            test.status === 'pass' ? 'bg-emerald-100 text-emerald-700' :
            test.status === 'fail' ? 'bg-red-100 text-red-700' :
            test.status === 'progress' ? 'bg-amber-100 text-amber-700' :
            'bg-slate-100 text-slate-600'
          }`}>
            {test.status === 'pass' ? '✓ PASS' : test.status === 'fail' ? '✕ OOS' : test.status === 'progress' ? 'IN PROGRESS' : 'PENDING'}
          </span>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
          {/* LEFT — Specification (read-only) */}
          <div>
            <div className="text-[10px] uppercase tracking-wide text-slate-500 font-bold mb-2">Specification</div>
            <div className="space-y-2.5 text-sm">
              <div className="flex">
                <span className="w-24 text-slate-500 text-xs">Method:</span>
                <span className="flex-1 font-mono text-slate-800">{test.method}</span>
              </div>
              <div className="flex">
                <span className="w-24 text-slate-500 text-xs">Spec:</span>
                <span className="flex-1 font-semibold text-slate-800">{test.spec}</span>
              </div>
              <div className="flex">
                <span className="w-24 text-slate-500 text-xs">Equipment:</span>
                <span className="flex-1 font-mono text-slate-800">{test.equipment}</span>
              </div>
              <div className="flex items-start">
                <span className="w-24 text-slate-500 text-xs">Calibration:</span>
                <span className="flex-1">
                  <span className="inline-flex items-center gap-1 text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded">
                    <Icon name="check" className="w-3 h-3" /> Valid · ครบ 12 พ.ค. 2569
                  </span>
                </span>
              </div>
              <div className="flex">
                <span className="w-24 text-slate-500 text-xs">SOP:</span>
                <a href="#" className="flex-1 text-emerald-700 hover:underline font-medium text-xs flex items-center gap-1">
                  SOP-QC-{test.id.toUpperCase()}-001 v2.1 <Icon name="link" className="w-3 h-3" />
                </a>
              </div>
              {test.required && (
                <div className="text-[11px] text-amber-700 font-semibold flex items-center gap-1 mt-2 px-2 py-1 bg-amber-50 rounded border border-amber-200">
                  <Icon name="alert" className="w-3 h-3" /> Required สำหรับ Release
                </div>
              )}
            </div>
          </div>

          {/* RIGHT — Result entry */}
          <div className="lg:border-l lg:pl-5 lg:border-slate-100">
            <div className="text-[10px] uppercase tracking-wide text-slate-500 font-bold mb-2">Result Entry</div>

            {test.type === 'numeric' && (
              <div className="space-y-3">
                <div>
                  <label className="text-[11px] text-slate-500 font-semibold uppercase">Reading <span className="text-red-500">*</span></label>
                  <div className="relative">
                    <input className="field-input text-lg font-mono font-bold pr-12"
                      type="number" step={1 / Math.pow(10, test.decimals)}
                      placeholder="—"
                      value={reading}
                      onChange={e => setReading(e.target.value)} />
                    {test.unit && (
                      <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-500">{test.unit}</span>
                    )}
                  </div>
                </div>

                <div>
                  <label className="text-[11px] text-slate-500 font-semibold uppercase">Replicate</label>
                  <div className="grid grid-cols-3 gap-2 mt-1">
                    {[1, 2, 3].map(n => (
                      <button key={n} onClick={() => setReplicate(n)}
                        className={`px-3 py-2 rounded-lg text-sm font-semibold border transition-all ${
                          replicate === n ? 'bg-emerald-50 border-emerald-400 text-emerald-700' : 'bg-white border-slate-200 text-slate-500'
                        }`}>Run {n}</button>
                    ))}
                  </div>
                </div>

                {/* Live spec check */}
                {hasReading && (
                  <div className={`px-3 py-2 rounded-lg border text-sm flex items-center justify-between ${
                    inRange ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-red-50 border-red-300 text-red-800'
                  }`}>
                    <span className="font-mono font-bold">{r} {test.unit}</span>
                    <span className="font-semibold flex items-center gap-1">
                      {inRange ? <><Icon name="check" className="w-4 h-4" /> Within range</> : <><Icon name="x" className="w-4 h-4" /> OOS — out of spec</>}
                    </span>
                  </div>
                )}
              </div>
            )}

            {test.type === 'pass_fail' && (
              <div>
                <label className="text-[11px] text-slate-500 font-semibold uppercase">บันทึกผล</label>
                <div className="grid grid-cols-2 gap-2 mt-1">
                  <button onClick={() => handleSave('pass')}
                    className="px-4 py-3 rounded-xl bg-emerald-50 border-2 border-emerald-200 hover:border-emerald-500 text-emerald-700 font-bold flex items-center justify-center gap-1.5">
                    <Icon name="check" className="w-5 h-5" /> PASS
                  </button>
                  <button onClick={() => handleSave('oos')}
                    className="px-4 py-3 rounded-xl bg-red-50 border-2 border-red-200 hover:border-red-500 text-red-700 font-bold flex items-center justify-center gap-1.5">
                    <Icon name="x" className="w-5 h-5" /> FAIL
                  </button>
                </div>
              </div>
            )}

            <div className="grid grid-cols-2 gap-3 mt-4">
              <div>
                <label className="text-[11px] text-slate-500 font-semibold uppercase">Equipment</label>
                <input className="field-input text-sm" value={equipment} onChange={e => setEquipment(e.target.value)} />
              </div>
              <div>
                <label className="text-[11px] text-slate-500 font-semibold uppercase">Analyst</label>
                <input className="field-input text-sm" value={analyst} onChange={e => setAnalyst(e.target.value)} />
              </div>
            </div>

            <div className="mt-3">
              <label className="text-[11px] text-slate-500 font-semibold uppercase">Note (optional)</label>
              <textarea className="field-input text-sm min-h-[60px] resize-none"
                placeholder="หมายเหตุ / สังเกตการณ์ (optional)"
                value={note} onChange={e => setNote(e.target.value)} />
            </div>

            {test.type === 'numeric' && (
              <div className="flex gap-2 mt-4 pt-3 border-t border-slate-100">
                <button onClick={onDiscard} className="btn btn-ghost">Discard</button>
                <button onClick={() => handleSave()}
                  disabled={!hasReading}
                  className="btn btn-primary flex-1 justify-center">
                  Save & Next <Icon name="play" className="w-3 h-3" />
                </button>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* History */}
      <div className="panel p-4 mt-3">
        <div className="text-[10px] uppercase tracking-wide text-slate-500 font-bold mb-2 flex items-center gap-1">
          <Icon name="clock" className="w-3.5 h-3.5" /> History · {test.name}
        </div>
        <div className="space-y-1 text-[11px] font-mono">
          {(test.history || []).length === 0 && (
            <div className="text-slate-400 italic">ยังไม่มีประวัติ</div>
          )}
          {(test.history || []).map((h, i) => (
            <div key={i} className="flex gap-2 text-slate-600">
              <span className="text-slate-400 flex-shrink-0">{h.time}</span>
              <span>{h.text}</span>
            </div>
          ))}
        </div>
      </div>

      {/* OOS modal */}
      {oosModal && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setOosModal(null)}>
          <div className="bg-white max-w-md w-full rounded-2xl shadow-2xl p-6" onClick={e => e.stopPropagation()}>
            <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-4">
              <Icon name="alert" className="w-6 h-6" />
            </div>
            <h3 className="text-lg font-bold text-slate-900 mb-1">⚠ Out of Specification</h3>
            <p className="text-sm text-slate-600 mb-4">
              ค่า <span className="font-mono font-bold text-red-700">{oosModal.value} {test.unit}</span> อยู่นอกช่วง <span className="font-mono font-bold">{test.spec}</span>
            </p>
            <p className="text-xs text-slate-500 mb-5">เลือกการดำเนินการ:</p>
            <div className="space-y-2">
              <button onClick={() => { setOosModal(null); onSave({ reading, replicate, analyst, equipment, note, status: 'fail', completedAt: nowTime() }); }}
                className="w-full px-4 py-3 rounded-xl bg-red-50 hover:bg-red-100 border border-red-200 text-left">
                <div className="font-bold text-red-700 text-sm">บันทึกเป็น OOS</div>
                <div className="text-[11px] text-red-600">ระบบจะเปิด OOS Investigation อัตโนมัติ</div>
              </button>
              <button onClick={() => { setOosModal(null); setReading(''); }}
                className="w-full px-4 py-3 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-left">
                <div className="font-bold text-amber-700 text-sm">ทดสอบใหม่ (Re-test)</div>
                <div className="text-[11px] text-amber-600">ล้างค่า กรอกใหม่ พร้อมเหตุผล</div>
              </button>
              <button onClick={() => setOosModal(null)}
                className="w-full px-4 py-3 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-left">
                <div className="font-bold text-slate-700 text-sm">ทิ้งค่า (Discard)</div>
                <div className="text-[11px] text-slate-500">ลบ reading ออก ไม่บันทึก</div>
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================ APP ============================ */
function App() {
  const [stage, setStage] = useState('registered');
  const [timestamps, setTimestamps] = useState({ registered: '20 พ.ค.' });
  const [sampling, setSampling] = useState({ confirmed: false, deducted: 0, txnRef: '', confirmedAt: '', confirmedBy: '' });
  const [tests, setTests] = useState(TESTS_TEMPLATE.map(t => ({ ...t, status: 'todo', history: [] })));
  const [activeId, setActiveId] = useState(TESTS_TEMPLATE[0].id);
  const [submitOpen, setSubmitOpen] = useState(false);
  // Item 7: Notification
  const [toast, setToastState] = useState(null);
  const [notifications, setNotifications] = useState([
    { id: 'n1', title: '⏳ มี sample รอ Review', msg: 'QC-2026-000005 ผ่านการทดสอบครบ', time: '5 นาทีที่แล้ว', read: false },
    { id: 'n2', title: '✓ Warehouse verified', msg: 'QC-2026-000003 ปล่อยเข้าคลังเรียบร้อย', time: '1 ชม.ที่แล้ว', read: false },
  ]);
  const [bellOpen, setBellOpen] = useState(false);

  const pushToast = (t) => setToastState(t);
  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToastState(null), 4000);
    return () => clearTimeout(id);
  }, [toast]);
  const unreadCount = notifications.filter(n => !n.read).length;
  const markAllRead = () => setNotifications(notifications.map(n => ({ ...n, read: true })));

  const hasOOS = tests.some(t => t.status === 'fail');
  const requiredDone = tests.filter(t => t.required).every(t => t.status === 'pass' || t.status === 'fail');
  const allPass = requiredDone && !hasOOS;

  const activeTest = tests.find(t => t.id === activeId);

  const confirmSampling = () => {
    const ts = nowTime();
    setSampling({
      confirmed: true,
      deducted: SAMPLING_PLAN.baseSize,
      txnRef: `TXN-2026-${Math.floor(Math.random() * 99999).toString().padStart(5, '0')}`,
      confirmedAt: ts,
      confirmedBy: 'PA สมหญิง',
    });
    setStage('draft');
    setTimestamps(prev => ({ ...prev, draft: ts }));
  };
  const reverseSampling = () => {
    if (!confirm('ยกเลิก sampling และคืน stock ' + SAMPLING_PLAN.baseSize + ' หน่วย?')) return;
    setSampling({ confirmed: false, deducted: 0, txnRef: '', confirmedAt: '', confirmedBy: '' });
    setStage('registered');
    setTimestamps(prev => { const { draft, ...rest } = prev; return rest; });
  };

  const saveTest = (data) => {
    setTests(prev => prev.map(t => t.id === activeId ? {
      ...t,
      ...data,
      history: [
        ...(t.history || []),
        { time: nowFull(), text: `Reading ${data.reading || data.status} entered by ${data.analyst}` },
      ],
    } : t));
    // Promote stage if first test done
    if (stage === 'draft') {
      const ts = nowTime();
      setStage('in_progress');
      setTimestamps(prev => ({ ...prev, in_progress: ts }));
    }
    // Auto-advance to next pending test
    const nextTodo = tests.find(t => t.id !== activeId && t.status === 'todo');
    if (nextTodo) setActiveId(nextTodo.id);
  };
  const discardTest = () => { /* keep simple — just blur */ };

  const submitForReview = () => {
    const ts = nowTime();
    setStage('approved');
    setTimestamps(prev => ({ ...prev, approved: ts }));
    setSubmitOpen({ kind: 'review' });
    pushToast({ kind: 'info', icon: '⏳', title: 'ส่ง Review แล้ว', msg: 'รอ QA Manager อนุมัติ' });
  };
  // Item 6: Dual Approval — split Release into QC + Warehouse
  const qcRelease = () => {
    const ts = nowTime();
    setStage('qc_released');
    setTimestamps(prev => ({ ...prev, qc_released: ts }));
    setSubmitOpen({ kind: 'qc_release' });
    pushToast({ kind: 'success', icon: '✓', title: 'QC Released', msg: 'รอ Warehouse ตรวจนับและ verify' });
  };
  const warehouseVerify = () => {
    const ts = nowTime();
    setStage('wh_verified');
    setTimestamps(prev => ({ ...prev, wh_verified: ts }));
    setSubmitOpen({ kind: 'wh_verified' });
    pushToast({ kind: 'success', icon: '🎉', title: 'Warehouse Verified', msg: 'Lot พร้อมขาย' });
  };

  return (
    <div className="min-h-screen pb-24">
      <StatusBar stage={stage} timestamps={timestamps} hasOOS={hasOOS} />

      {/* Top bar */}
      <div className="bg-white border-b border-slate-100">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3 flex-wrap">
          <a href="/" className="flex items-center gap-1 text-slate-500 hover:text-slate-800 text-sm">
            <Icon name="back" className="w-4 h-4" /> <span className="hidden sm:inline">Quality / QC Entry</span>
          </a>
          <span className="text-slate-300">/</span>
          <span className="font-mono font-bold text-sm text-slate-900">{SAMPLE.sampleNo}</span>
          <div className="flex-1" />
          {/* Item 7: Notification bell */}
          <div className="relative">
            <button onClick={() => setBellOpen(!bellOpen)}
              className="relative w-10 h-10 rounded-lg hover:bg-slate-100 flex items-center justify-center">
              <span className="text-xl">🔔</span>
              {unreadCount > 0 && (
                <span className="absolute top-1 right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">
                  {unreadCount}
                </span>
              )}
            </button>
            {bellOpen && (
              <>
                <div className="fixed inset-0 z-30" onClick={() => setBellOpen(false)} />
                <div className="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-slate-200 z-40 overflow-hidden">
                  <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                    <div className="font-bold text-sm">การแจ้งเตือน</div>
                    {unreadCount > 0 && (
                      <button onClick={markAllRead} className="text-[11px] text-emerald-700 hover:underline font-semibold">อ่านทั้งหมด</button>
                    )}
                  </div>
                  <div className="max-h-80 overflow-y-auto">
                    {notifications.length === 0 ? (
                      <div className="px-4 py-8 text-center text-slate-400 text-sm">ไม่มีการแจ้งเตือน</div>
                    ) : notifications.map(n => (
                      <div key={n.id} className={`px-4 py-3 border-b border-slate-50 ${!n.read ? 'bg-blue-50/40' : ''}`}>
                        <div className="flex items-start gap-2">
                          {!n.read && <span className="w-1.5 h-1.5 rounded-full bg-blue-500 mt-1.5 flex-shrink-0"></span>}
                          <div className="flex-1">
                            <div className="font-semibold text-sm text-slate-900">{n.title}</div>
                            <div className="text-xs text-slate-600 mt-0.5">{n.msg}</div>
                            <div className="text-[10px] text-slate-400 mt-1">{n.time}</div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>
          <button className="btn btn-ghost">
            <Icon name="print" className="w-4 h-4" /> Print
          </button>
        </div>
      </div>

      {/* Sample header */}
      <div className="bg-gradient-to-br from-slate-50 to-white border-b border-slate-100">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4">
          <div className="flex items-baseline gap-2 flex-wrap mb-1">
            <span className="text-[10px] font-mono font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded">{SAMPLE.product.code}</span>
            <h1 className="text-xl font-bold text-slate-900">{SAMPLE.product.name}</h1>
          </div>
          <div className="flex items-center gap-3 text-xs text-slate-600 flex-wrap">
            <span>Lot <span className="font-mono font-semibold text-slate-800">{SAMPLE.lot}</span></span>
            <span className="text-slate-300">·</span>
            <span>Source: {SAMPLE.source}</span>
            <span className="text-slate-300">·</span>
            <span>Received: {SAMPLE.receivedDate}</span>
            <span className="text-slate-300">·</span>
            <span className="flex items-center gap-1"><Icon name="user" className="w-3 h-3" /> {SAMPLE.receivedBy}</span>
            <span className="text-slate-300">·</span>
            <span>Panel: <span className="font-semibold text-slate-800">{SAMPLE.panel}</span></span>
          </div>
        </div>
      </div>

      {/* Main content — two columns */}
      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-5">
        <div className="grid grid-cols-1 lg:grid-cols-[320px,1fr] gap-4">
          {/* LEFT */}
          <aside className="space-y-3">
            <SamplingPlanCard stage={stage} sampling={sampling} onConfirm={confirmSampling} onReverse={reverseSampling} />
            <TestList tests={tests} activeId={activeId} onSelect={setActiveId} samplingConfirmed={sampling.confirmed} />
          </aside>

          {/* RIGHT */}
          <section>
            {activeTest && <TestDetail
              test={activeTest}
              onSave={saveTest}
              onDiscard={discardTest}
              samplingConfirmed={sampling.confirmed}
            />}
          </section>
        </div>
      </main>

      {/* Footer */}
      <footer className="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200 px-4 sm:px-6 py-3 z-30">
        <div className="max-w-7xl mx-auto flex items-center gap-3 flex-wrap">
          <div className="flex-1 text-xs text-slate-600">
            {!sampling.confirmed ? (
              <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-slate-400"></span> รอยืนยัน Sampling Plan</span>
            ) : (
              <span className="flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                {tests.filter(t => t.status !== 'todo').length}/{tests.length} tests · {hasOOS ? <span className="text-red-600 font-semibold">{tests.filter(t=>t.status==='fail').length} OOS</span> : 'no OOS'} · auto-saved
              </span>
            )}
          </div>
          {stage === 'in_progress' && requiredDone && (
            <button onClick={submitForReview} className="btn btn-primary">
              Submit for Review →
            </button>
          )}
          {stage === 'approved' && (
            <button onClick={qcRelease} className="btn btn-primary">
              <Icon name="check" className="w-4 h-4" /> QC Release ✓ <span className="text-[10px] opacity-70">(by QC)</span>
            </button>
          )}
          {stage === 'qc_released' && (
            <button onClick={warehouseVerify} className="btn"
              style={{ background: '#f59e0b', color: 'white' }}>
              <Icon name="package" className="w-4 h-4" /> Warehouse Verify ✓ <span className="text-[10px] opacity-70">(by Warehouse)</span>
            </button>
          )}
          {stage === 'wh_verified' && (
            <span className="text-emerald-700 font-bold text-sm flex items-center gap-1.5">
              <Icon name="check" className="w-4 h-4" /> Released ครบสองขั้น · {timestamps.wh_verified}
            </span>
          )}
          {hasOOS && stage === 'in_progress' && (
            <button className="btn btn-danger">
              <Icon name="alert" className="w-4 h-4" /> Open OOS Investigation
            </button>
          )}
        </div>
      </footer>

      {/* Submit confirm */}
      {submitOpen && (() => {
        const headlines = {
          review:       { title: 'ส่งทบทวนเรียบร้อย',    msg: 'รอ QA Manager ตรวจสอบ → QC Release',                                   color: 'emerald' },
          qc_release:   { title: '✓ QC Released',         msg: `Sample ${SAMPLE.sampleNo} ผ่าน QC แล้ว — รอฝ่ายคลังตรวจนับและ verify`, color: 'violet'  },
          wh_verified:  { title: '🎉 Warehouse Verified', msg: `Lot ${SAMPLE.lot} พร้อมขาย — release ครบทั้ง 2 ขั้น`,                  color: 'emerald' },
        }[submitOpen.kind] || { title: '✓ Done', msg: '', color: 'emerald' };
        const ringColor = {
          emerald: 'bg-emerald-100 text-emerald-600',
          violet:  'bg-violet-100 text-violet-600',
        }[headlines.color];
        return (
          <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setSubmitOpen(null)}>
            <div className="bg-white max-w-md w-full rounded-2xl shadow-2xl p-6" onClick={e => e.stopPropagation()}>
              <div className={`w-12 h-12 rounded-full ${ringColor} flex items-center justify-center mb-4`}>
                <Icon name="check" className="w-6 h-6" />
              </div>
              <h3 className="text-lg font-bold text-slate-900 mb-1">{headlines.title}</h3>
              <p className="text-sm text-slate-600 mb-3">{headlines.msg}</p>
              {submitOpen.kind === 'qc_release' && (
                <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-900 mb-4 flex items-start gap-2">
                  <span>⏳</span>
                  <div>
                    <strong>ขั้นถัดไป:</strong> ฝ่ายคลัง (Warehouse) ต้องตรวจนับสินค้าจริงก่อนกดปุ่ม "Warehouse Verify" เพื่อปล่อยเข้าระบบขาย
                  </div>
                </div>
              )}
              <button onClick={() => setSubmitOpen(null)} className="btn btn-primary w-full justify-center">
                ตกลง
              </button>
            </div>
          </div>
        );
      })()}

      {/* Item 7: Toast popup */}
      {toast && (
        <div className="fixed bottom-24 right-6 z-[100]">
          <div className={`text-white rounded-xl shadow-2xl px-4 py-3 min-w-[280px] max-w-[400px] flex items-start gap-3 ${
            toast.kind === 'success' ? 'bg-emerald-600' :
            toast.kind === 'warn'    ? 'bg-amber-600'   :
            toast.kind === 'error'   ? 'bg-red-600'     : 'bg-blue-600'
          }`}>
            <span className="text-xl flex-shrink-0">{toast.icon || 'ℹ️'}</span>
            <div className="flex-1">
              <div className="font-bold text-sm">{toast.title}</div>
              {toast.msg && <div className="text-xs opacity-90 mt-0.5">{toast.msg}</div>}
            </div>
            <button onClick={() => setToastState(null)} className="text-white/70 hover:text-white">✕</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
