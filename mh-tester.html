<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', 'Sarabun', system-ui, sans-serif; color: #1f2937; background: #ffffff; }
  .heading-display { font-family: 'Sarabun', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .brand-mark { font-family: 'Sarabun', system-ui, sans-serif; font-weight: 800; font-size: 22px; color: #65a30d; }

  /* Brand green = #319754 */
  .bg-brand { background-color: #319754; }
  .bg-brand-dark { background-color: #26713e; }
  .bg-brand-light { background-color: #e9f5ee; }
  .text-brand { color: #319754; }
  .text-brand-dark { color: #26713e; }
  .border-brand { border-color: #319754; }
  .bg-green-600 { background-color: #319754 !important; }
  .bg-green-700 { background-color: #26713e !important; }
  .text-green-600 { color: #319754 !important; }
  .text-green-700 { color: #26713e !important; }
  .text-green-800 { color: #1f5a31 !important; }
  .border-green-300 { border-color: #86c79b !important; }
  .border-green-400 { border-color: #66b482 !important; }
  .hover\:bg-green-700:hover { background-color: #26713e !important; }
  .hover\:border-green-300:hover { border-color: #86c79b !important; }
  .hover\:border-green-400:hover { border-color: #66b482 !important; }

  .btn-primary-pill { background: #319754; color: white; padding: 9px 24px; border-radius: 9999px; font-weight: 600; font-size: 14px; border: 1px solid #319754; transition: all .15s; }
  .btn-primary-pill:hover { background: #26713e; }
  .btn-outline-pill { background: white; color: #26713e; padding: 9px 24px; border-radius: 9999px; font-weight: 600; font-size: 14px; border: 1px solid #319754; transition: all .15s; }
  .btn-outline-pill:hover { background: #f0fdf4; }

  .main-nav { background: #319754; color: white; }
  .main-nav a, .main-nav button.navbtn { color: white; padding: 14px 22px; font-weight: 600; font-size: 15px; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 0; cursor: pointer; font-family: inherit; }
  .main-nav a:hover, .main-nav button.navbtn:hover { background: rgba(0,0,0,.08); }
  .main-nav a.active, .main-nav button.navbtn.active { background: white; color: #319754; border-radius: 9999px; margin: 6px 4px; padding: 8px 22px; }
  .nav-dropdown { position: absolute; top: 100%; left: 0; background: white; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 12px 32px -8px rgba(0,0,0,.25); min-width: 260px; padding: 6px; z-index: 100; margin-top: 4px; }
  .main-nav .nav-dropdown a { display: flex !important; align-items: center; gap: 10px; padding: 10px 14px !important; color: #1f2937 !important; background: transparent; border-radius: 10px; font-size: 14px; font-weight: 500; margin: 0; }
  .main-nav .nav-dropdown a:hover { background: #f0fdf4 !important; color: #26713e !important; }
  .main-nav .nav-dropdown a.active { background: #319754 !important; color: white !important; margin: 0; }
  .settings-pop { position: absolute; top: calc(100% + 8px); right: 0; background: white; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 12px 32px -8px rgba(0,0,0,.2); width: 320px; padding: 16px; z-index: 60; }
  .switch { position: relative; width: 44px; height: 24px; background: #e5e7eb; border-radius: 9999px; cursor: pointer; transition: background .15s; flex-shrink: 0; }
  .switch.on { background: #319754; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on::after { transform: translateX(20px); }
  .main-nav { overflow: visible !important; }
  .main-nav > div { overflow: visible !important; }

  .chip-option {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 16px; border-radius: 9999px;
    border: 2px solid #e5e7eb; background: white;
    font-size: 13px; font-weight: 600; color: #4b5563;
    cursor: pointer; transition: all .15s;
  }
  .chip-option:hover { border-color: #319754; color: #319754; }
  .chip-option.selected { background: #319754; color: white; border-color: #319754; }
  .step-dot {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px;
    border: 3px solid; transition: all .2s;
  }
  .step-dot.todo   { background: white;   border-color: #e5e7eb; color: #9ca3af; }
  .step-dot.active { background: #319754; border-color: #319754; color: white; }
  .step-dot.done   { background: #319754; border-color: #319754; color: white; }

  /* Card variants for visual interest */
  .card-glow { box-shadow: 0 4px 12px -4px rgba(49,151,84,.15); }
  .card-glow-amber { box-shadow: 0 8px 24px -8px rgba(245,158,11,.30); }

  /* Hero pattern */
  .hero-pattern {
    background:
      radial-gradient(ellipse at top right, rgba(49,151,84,.10), transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(234,179,8,.06), transparent 50%),
      linear-gradient(135deg, #f0fdf4 0%, #fefce8 100%);
  }

  /* Gradient cards */
  .grad-purple { background: linear-gradient(135deg, #faf5ff 0%, #ede9fe 100%); }
  .grad-orange { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); }
  .grad-rose   { background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%); }
  .grad-blue   { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
  .grad-green  { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); }
  .grad-amber  { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); }
  .grad-pink   { background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%); }

  /* Animated pulse for ongoing items */
  @keyframes soft-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .pulse-soft { animation: soft-pulse 2s infinite; }

  /* Confetti dots for achievements */
  .achievement-card { position: relative; overflow: hidden; }
  .achievement-card::before {
    content: ''; position: absolute; top: -30%; right: -10%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,215,0,.18), transparent 70%);
    pointer-events: none;
  }
</style>
</head>

function Header({ active = 'tester', isLoggedIn, onLogin, onLogout, user }) {

/* ============================ LOGIN GATE ============================ */
function LoginGate({ mode, enrollProgram, onLogin, onSwitchMode, onGoRegister }) {

  const [password, setPassword] = useState('');

  const submit = (e) => {
    e?.preventDefault();
    // Mock login — accept anything
    onLogin({ name: email.split('@')[0] || 'User', email: email || 'demo@metaherb.co.th' });

  return (
    <div className="min-h-screen hero-pattern flex items-center justify-center px-4 py-12">

          <div className="mb-5 bg-white border border-green-300 rounded-2xl p-4 flex items-center gap-3 card-glow">

            <div className="flex-1 min-w-0">
              <div className="text-[10px] font-bold uppercase tracking-widest text-green-700">คุณกำลังจะสมัครเข้าร่วม</div>
              <div className="font-bold text-sm text-slate-900 leading-tight">{enrollProgram.title}</div>
              <div className="text-xs text-gray-500">เข้าสู่ระบบก่อนเพื่อสมัคร</div>
            </div>
          </div>

            <div className="w-16 h-16 rounded-full bg-green-100 mx-auto flex items-center justify-center text-3xl mb-3">🌿</div>

              <label className="text-xs font-bold uppercase tracking-wider text-gray-500 block mb-1.5">Email</label>

                <a href="#" className="text-green-700 font-semibold hover:underline">ลืมรหัสผ่าน?</a>

/* ============================ SURVEY MODAL (inline) ============================ */
function SurveyModal({ program, stage, onClose, onSubmit }) {
  if (!program || !stage) return null;
  const stageInfo = {
    A: { title: 'ก่อนใช้ · Stage A', subtitle: 'ตอบก่อนรับสินค้า', points: 30, color: 'amber' },
    B: { title: 'ระหว่างใช้ · Stage B', subtitle: 'ตอบหลังใช้ระหว่างทาง', points: 50, color: 'blue' },
    C: { title: 'หลังจบ · Stage C', subtitle: 'ตอบเมื่อครบกำหนด', points: 70, color: 'green' },
  }[stage];

  const questions = {
    A: [
      { id: 'a1', q: 'เคยใช้สินค้ากลุ่ม "' + program.title + '" มาก่อนไหม?', kind: 'choice', options: ['ไม่เคย', 'เคย 1-2 ครั้ง', 'ใช้เป็นประจำ'] },
      { id: 'a2', q: 'คาดหวังอะไรจากสินค้านี้?', kind: 'choice', multi: true, options: ['รสชาติดี', 'สรรพคุณดี', 'ราคาคุ้ม', 'ปลอดภัย'] },
      { id: 'a3', q: 'ระดับปัญหาปัจจุบัน (1 = น้อย, 5 = มาก)', kind: 'rating', max: 5 },
    ],
    B: [
      { id: 'b1', q: 'รสชาติเป็นยังไงบ้าง?', kind: 'rating', max: 5 },
      { id: 'b2', q: 'กลิ่นเป็นยังไง?', kind: 'rating', max: 5 },
      { id: 'b3', q: 'ความสะดวกในการใช้?', kind: 'rating', max: 5 },
      { id: 'b4', q: 'อาการหลังใช้', kind: 'choice', multi: true, options: ['ดีขึ้น', 'รู้สึกดี', 'ปกติ', 'ไม่ค่อยรู้สึก', 'แย่ลง'] },
    ],
    C: [
      { id: 'c1', q: 'จะซื้อไหม?', kind: 'choice', options: ['ซื้อแน่นอน', 'น่าจะซื้อ', 'ไม่แน่ใจ', 'ไม่ซื้อ'] },
      { id: 'c2', q: 'ราคาที่เหมาะสม', kind: 'choice', options: ['<300', '300-500', '500-800', '800-1200', '>1200'] },
      { id: 'c3', q: 'ให้คะแนนรวม', kind: 'rating', max: 5 },
    ],
  }[stage];

  const [answers, setAnswers] = useState({});
  const allDone = questions.every(q => {
    const a = answers[q.id];
    if (q.kind === 'rating') return a > 0;
    if (q.kind === 'choice' && q.multi) return Array.isArray(a) && a.length > 0;
    return a;
  });

  return (
    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-3" onClick={onClose}>
      <div className="bg-white max-w-xl w-full max-h-[90vh] overflow-y-auto rounded-3xl shadow-2xl" onClick={e => e.stopPropagation()}>
        {/* Header */}
        <div className={`${program.gradient || 'grad-green'} px-6 py-5 relative`}>
          <button onClick={onClose} className="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/80 hover:bg-white flex items-center justify-center text-gray-600 text-xl">✕</button>
          <div className="flex items-center gap-3 mb-2">
            <div className="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-3xl shadow-sm">{program.emoji}</div>
            <div>
              <div className="text-[10px] font-bold uppercase tracking-widest text-gray-700">{stageInfo.subtitle}</div>
              <div className="font-bold text-sm">{program.title}</div>
              <div className="text-xs text-gray-600">{program.brand}</div>
            </div>
          </div>
          <h2 className="heading-display text-xl mt-3">📋 {stageInfo.title}</h2>
          <div className="mt-1 text-xs text-gray-700">ตอบครบรับ <strong className="text-amber-700">+{stageInfo.points} pts</strong></div>
        </div>

        {/* Body */}
        <div className="p-5 space-y-5">
          {questions.map((q, idx) => (
            <div key={q.id} className="bg-gray-50 rounded-xl p-4">
              <div className="flex items-start gap-2 mb-3">
                <span className="w-6 h-6 rounded-full bg-green-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">{idx + 1}</span>
                <h3 className="font-bold text-sm leading-tight flex-1">{q.q}</h3>
              </div>

              {q.kind === 'choice' && (
                <div className="flex flex-wrap gap-2 ml-8">
                  {q.options.map(opt => {
                    const selected = q.multi
                      ? (answers[q.id] || []).includes(opt)
                      : answers[q.id] === opt;
                    return (
                      <button key={opt}
                        onClick={() => {
                          if (q.multi) {
                            const arr = answers[q.id] || [];
                            setAnswers({ ...answers, [q.id]: arr.includes(opt) ? arr.filter(x => x !== opt) : [...arr, opt] });
                          } else {
                            setAnswers({ ...answers, [q.id]: opt });
                          }
                        }}
                        className={`chip-option text-xs ${selected ? 'selected' : ''}`}>
                        {selected && <span>✓</span>} {opt}
                      </button>
                    );
                  })}
                </div>
              )}

              {q.kind === 'rating' && (
                <div className="flex items-center gap-2 ml-8">
                  {Array.from({ length: q.max }).map((_, i) => (
                    <button key={i} onClick={() => setAnswers({ ...answers, [q.id]: i + 1 })}
                      className="text-3xl hover:scale-110 transition-transform">
                      {i < (answers[q.id] || 0) ? <span className="text-amber-400">★</span> : <span className="text-gray-300">★</span>}
                    </button>
                  ))}
                  {answers[q.id] > 0 && <span className="ml-2 text-sm text-gray-600">{answers[q.id]} / {q.max}</span>}
                </div>
              )}
            </div>
          ))}

          <div className="text-xs text-gray-500 text-center">
            {allDone ? <span className="text-green-700 font-bold">✓ ตอบครบแล้ว — กดส่งเลย!</span> : `ตอบครบ ${questions.length - questions.filter(q => { const a = answers[q.id]; if (q.kind === 'rating') return a > 0; if (q.kind === 'choice' && q.multi) return Array.isArray(a) && a.length > 0; return a; }).length} ข้อก่อนส่ง`}
          </div>

          <div className="flex gap-2">
            <button onClick={onClose} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-full">ปิด</button>
            <button onClick={() => { onSubmit(stage, answers); onClose(); }}
              disabled={!allDone}
              className={`flex-[2] py-3 rounded-full font-bold ${allDone ? 'bg-green-600 hover:bg-green-700 text-white card-glow' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
              ส่งและรับ +{stageInfo.points} pts
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================ REGISTRATION WIZARD ============================ */
function Wizard({ onComplete, enrollProgram }) {
  const [step, setStep] = useState(1);
  const [profile, setProfile] = useState({
    name: '', age: '', gender: '',
    lifestyle: [], health: [], habits: [], notes: '',
  });

  const toggle = (key, val) => {
    setProfile(p => ({ ...p, [key]: p[key].includes(val) ? p[key].filter(x => x !== val) : [...p[key], val] }));
  };

  const stepLabel = ['ข้อมูลพื้นฐาน', 'Lifestyle', 'ปัญหาสุขภาพ', 'พฤติกรรม', 'ยืนยัน'];

  const canNext = (() => {
    if (step === 1) return profile.name && profile.age && profile.gender;
    if (step === 2) return profile.lifestyle.length > 0;
    if (step === 3) return profile.health.length > 0;
    if (step === 4) return profile.habits.length > 0;
    return true;
  })();

  return (
    <div>
      <section className="hero-pattern border-b border-gray-200">
        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-8 text-center">
          <div className="text-xs font-bold uppercase tracking-widest text-green-700 mb-2">PROFILE REGISTRATION</div>
          <h1 className="heading-display text-3xl sm:text-4xl mb-2">ตั้งค่า Profile ของคุณ</h1>
          <p className="text-gray-600">กรอกข้อมูล 4 ขั้น → ระบบจะแนะนำสินค้าที่เหมาะกับคุณ</p>
        </div>
      </section>

      <div className="max-w-3xl mx-auto px-4 sm:px-6 py-6">
        <div className="flex items-center gap-2 mb-2">
          {[1,2,3,4,5].map((n, i) => (
            <React.Fragment key={n}>
              <div className={`step-dot ${step === n ? 'active' : step > n ? 'done' : 'todo'}`}>
                {step > n ? '✓' : n}
              </div>
              {i < 4 && <div className={`flex-1 h-1 rounded ${step > n ? 'bg-green-500' : 'bg-gray-200'}`}></div>}
            </React.Fragment>
          ))}
        </div>
        <div className="text-xs text-gray-500 text-center">Step {step} / 5 — <b className="text-gray-800">{stepLabel[step-1]}</b></div>
      </div>

      <main className="max-w-3xl mx-auto px-4 sm:px-6 pb-12">
        <div className="bg-white rounded-2xl border border-gray-200 p-6 sm:p-8">

          {step === 1 && (
            <div>
              <h2 className="heading-display text-2xl mb-1">ข้อมูลพื้นฐาน</h2>
              <p className="text-sm text-gray-500 mb-6">เริ่มจากข้อมูลตัวคุณ</p>
              <div className="space-y-4">
                <div>
                  <label className="text-xs font-bold uppercase tracking-wider text-gray-500">ชื่อเล่น *</label>
                  <input value={profile.name} onChange={e => setProfile(p => ({...p, name: e.target.value}))}
                    placeholder="เช่น ก้อง, มิ้นท์"
                    className="mt-1 w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-green-500" />
                </div>
                <div>
                  <label className="text-xs font-bold uppercase tracking-wider text-gray-500">อายุ *</label>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {['15-24','25-34','35-44','45-54','55+'].map(a => (
                      <button key={a} onClick={() => setProfile(p => ({...p, age: a}))}
                        className={`chip-option ${profile.age === a ? 'selected' : ''}`}>{a}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="text-xs font-bold uppercase tracking-wider text-gray-500">เพศ *</label>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {['ชาย','หญิง','LGBTQ+','ไม่ระบุ'].map(g => (
                      <button key={g} onClick={() => setProfile(p => ({...p, gender: g}))}
                        className={`chip-option ${profile.gender === g ? 'selected' : ''}`}>{g}</button>

                  </div>

          {step === 2 && (
            <div>
              <h2 className="heading-display text-2xl mb-1">Lifestyle</h2>
              <p className="text-sm text-gray-500 mb-6">เลือกได้หลายข้อ — ใช้แนะสินค้าที่ตรงกลุ่ม</p>
              <div className="flex flex-wrap gap-2">
                {LIFESTYLE_GROUPS.map(g => (
                  <button key={g.id} onClick={() => toggle('lifestyle', g.id)}
                    className={`chip-option ${profile.lifestyle.includes(g.id) ? 'selected' : ''}`}>{g.label}</button>
                ))}

              <div className="mt-4 text-xs text-gray-500">เลือกแล้ว <b className="text-green-700">{profile.lifestyle.length}</b> กลุ่ม</div>
            </div>

          {step === 3 && (

              <h2 className="heading-display text-2xl mb-1">ปัญหาสุขภาพ</h2>
              <p className="text-sm text-gray-500 mb-6">เลือกได้หลายข้อ — ระดับ broad</p>

                  <button key={h.id} onClick={() => toggle('health', h.id)}
                    className={`chip-option ${profile.health.includes(h.id) ? 'selected' : ''}`}>{h.label}</button>

            </div>
          )}

          {step === 4 && (
            <div>
              <h2 className="heading-display text-2xl mb-1">พฤติกรรมการบริโภค</h2>
              <p className="text-sm text-gray-500 mb-6">รูปแบบสมุนไพรที่คุ้นเคย</p>
              <div className="flex flex-wrap gap-2">
                {CONSUMPTION_HABITS.map(h => (
                  <button key={h.id} onClick={() => toggle('habits', h.id)}

              <div className="mt-6">
                <label className="text-xs font-bold uppercase tracking-wider text-gray-500">หมายเหตุ (optional)</label>
                <textarea value={profile.notes} onChange={e => setProfile(p => ({...p, notes: e.target.value}))}
                  placeholder="เช่น แพ้ถั่ว..."
                  className="mt-1 w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-green-500 min-h-[80px] resize-none" />
              </div>
            </div>
          )}

          {step === 5 && (
            <div>
              <h2 className="heading-display text-2xl mb-1">✓ ยืนยัน Profile</h2>
              <p className="text-sm text-gray-500 mb-6">ตรวจสอบก่อนบันทึก</p>
              <div className="space-y-3 bg-gray-50 rounded-xl p-4">

                  <div><div className="text-[10px] text-gray-500 uppercase">อายุ</div><div className="font-bold">{profile.age}</div></div>
                  <div><div className="text-[10px] text-gray-500 uppercase">เพศ</div><div className="font-bold">{profile.gender}</div></div>
                </div>
                <div className="pt-3 border-t border-gray-200">
                  <div className="text-[10px] text-gray-500 uppercase mb-1.5">Lifestyle</div>
                  <div className="flex flex-wrap gap-1">
                    {profile.lifestyle.map(id => {
                      const g = LIFESTYLE_GROUPS.find(x => x.id === id);
                      return g && <span key={id} className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-semibold">{g.label}</span>;
                    })}
                  </div>
                </div>
              </div>
              {enrollProgram && (
                <div className="mt-4 bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 flex gap-2">
                  <span>🎁</span>
                  <div>หลังบันทึก → ระบบจะสมัครเข้าโปรแกรม <b>"{enrollProgram.title}"</b> ให้ทันที</div>
                </div>
              )}
            </div>
          )}

          <div className="flex gap-2 mt-8 pt-6 border-t border-gray-100">
            {step > 1 && (
              <button onClick={() => setStep(step - 1)} className="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-full">← กลับ</button>
            )}
            <div className="flex-1"></div>
            {step < 5 ? (
              <button onClick={() => setStep(step + 1)} disabled={!canNext}
                className={`px-6 py-2.5 font-bold rounded-full ${canNext ? 'bg-green-600 hover:bg-green-700 text-white card-glow' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
                ถัดไป →
              </button>
            ) : (
              <button onClick={() => onComplete(profile)}
                className="px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-full card-glow">
                ✓ บันทึก + ไป Dashboard
              </button>
            )}
          </div>
        </div>
      </main>
    </div>
  );
}

/* ============================ APP ============================ */
function App() {
  // Persistent auth state
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('mh_user') || 'null'); } catch { return null; }
  });
  const [profile, setProfile] = useState(() => {
    try { return JSON.parse(localStorage.getItem('mh_profile') || 'null'); } catch { return null; }
  });
  const [view, setView] = useState('dashboard'); // dashboard | wizard
  const [loginMode, setLoginMode] = useState(null); // null | 'login' | 'register'
  const [enrollProgram, setEnrollProgram] = useState(null);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('enroll');
    if (id) setEnrollProgram(ENROLL_MAP[id] || { id, emoji: '🧪', title: 'โปรแกรมที่เลือก', brand: '' });
  }, []);

  useEffect(() => {
    if (user) localStorage.setItem('mh_user', JSON.stringify(user)); else localStorage.removeItem('mh_user');
  }, [user]);
  useEffect(() => {
    if (profile) localStorage.setItem('mh_profile', JSON.stringify(profile));
  }, [profile]);

  const handleLogin = (userData) => {
    setUser(userData);
    setLoginMode(null);
    // If no profile yet → go wizard
    if (!profile) setView('wizard');
    else setView('dashboard');
  };

  const handleLogout = () => {
    setUser(null);
    setProfile(null);
    setView('dashboard');
    localStorage.removeItem('mh_user');
    localStorage.removeItem('mh_profile');
  };

  // Show login gate ONLY when explicitly triggered (clicked login/register/enroll)
  // OR when enrollProgram exists and user not logged in
  const needLogin = loginMode || (enrollProgram && !user);

  if (needLogin) {
    return (
      <div className="min-h-screen">
        <Header active="tester" isLoggedIn={!!user} user={user} onLogin={(m) => setLoginMode(m)} onLogout={handleLogout} />
        <LoginGate
          mode={loginMode || 'login'}
          enrollProgram={enrollProgram}
          onLogin={handleLogin}
          onSwitchMode={setLoginMode}
          onGoRegister={() => setLoginMode('register')} />
      </div>
    );
  }

  // Logged in but no profile → wizard (กรอก profile ก่อนเข้า dashboard)
  if (user && (!profile || view === 'wizard')) {
    return (
      <div className="min-h-screen">
        <Header active="tester" isLoggedIn={true} user={user} onLogout={handleLogout} />
        <Wizard
          enrollProgram={enrollProgram}
          onComplete={(p) => { setProfile(p); setView('dashboard'); }} />
      </div>
    );
  }

  // Browse-only dashboard (ไม่ login ก็ดูได้)
  return (
    <div className="min-h-screen">
      <Header active="tester" isLoggedIn={!!user} user={user} onLogin={(m) => setLoginMode(m)} onLogout={handleLogout} />
      {user ? (
        <Dashboard
          user={user}
          profile={profile}
          enrollProgram={enrollProgram}
          onClearEnroll={() => setEnrollProgram(null)}
          onEdit={() => setView('wizard')} />
      ) : (
        <GuestLanding onLogin={(m) => setLoginMode(m)} />
      )}
    </div>
  );
}
